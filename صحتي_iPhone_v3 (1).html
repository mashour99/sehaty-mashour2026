        statusColor = '#64748b'; statusText = 'لم يُسجَّل بعد'; statusBadge = 'يحتاج فحص';
      } else {
        daysAgo = Math.floor((Date.now() - parseDate(last.date)) / 86400000);
        if(daysAgo > s.interval){
          statusColor = '#f87171';
          statusText = `متأخر (${daysAgo - s.interval} يوم بعد الموعد)`;
          statusBadge = '⚠ متأخر';
        } else if(daysAgo > s.interval * 0.8){
          statusColor = '#fbbf24';
          statusText = `قريب من موعده (${s.interval - daysAgo} يوم متبقي)`;
          statusBadge = '⏰ قريب';
        } else {
          statusColor = '#4ade80';
          statusText = `محدّث (آخر فحص قبل ${daysAgo} يوم)`;
          statusBadge = '✓ محدّث';
        }
      }
      return `
        <div class="card" style="border-color:${statusColor}44">
          <div class="card-title flex-between">
            <span><span class="ct-icon">${s.icon}</span>${s.name}</span>
            <span class="badge" style="background:${statusColor}22;color:${statusColor};border:1px solid ${statusColor}44">${statusBadge}</span>
          </div>
          <div class="txt-sm txt-mute" style="margin-bottom:8px;line-height:1.6">${s.details} · يُنصَح ${s.intervalLabel}</div>
          <div class="txt-sm" style="color:${statusColor};margin-bottom:10px">${statusText}</div>
          <div style="display:flex;gap:6px">
            <button class="btn-sec" onclick="MODALS.screeningModal('${s.key}','${s.name}','${s.icon}')" style="flex:1;padding:9px">+ تسجيل فحص</button>
            ${s.key === 'foot' ? `<button class="btn-sec" onclick="MODALS.footExamModal()" style="flex:1;padding:9px;background:#7f1d1d22;border-color:#dc262644;color:#fca5a5">🦶 فحص مفصّل</button>` : ''}
          </div>
          ${records.length > 1 ? `<details style="margin-top:8px"><summary class="txt-sm" style="cursor:pointer;color:#64748b">📋 السجل (${records.length})</summary>
            <div style="margin-top:6px">${records.slice(0,5).map(r => `
              <div style="background:#0f172a;border-radius:6px;padding:6px 9px;margin-top:4px;font-size:11px;color:#cbd5e1">
                <b>${r.date}</b> — ${r.result || 'مسجّل'}${r.note ? ' · '+r.note:''}
              </div>
            `).join('')}</div></details>`:''}
        </div>
      `;
    }).join('')}
  `;
};


// ════════════════════════════════════════════════════════════════
//  AI INSIGHTS ENGINE — Pattern detection & smart suggestions
// ════════════════════════════════════════════════════════════════
function analyzePatterns(){
  const insights = [];

  // ────────── ANALYSIS 1: Time-of-day sugar patterns ──────────
  const m30 = sugarLog.filter(x=>within(x.date,30));
  if(m30.length >= 10){
    const byHour = {morning:[], afternoon:[], evening:[], night:[]};
    m30.forEach(r => {
      const h = parseInt((r.time||'12:00').split(':')[0]);
      if(h<11) byHour.morning.push(r.value);
      else if(h<16) byHour.afternoon.push(r.value);
      else if(h<20) byHour.evening.push(r.value);
      else byHour.night.push(r.value);
    });
    const avgs = {};
    Object.entries(byHour).forEach(([k,v])=>{
      if(v.length>=3) avgs[k] = Math.round(v.reduce((a,b)=>a+b,0)/v.length);
    });
    const labels = {morning:'الصباح',afternoon:'الظهيرة',evening:'المساء',night:'الليل'};
    const sorted = Object.entries(avgs).sort((a,b)=>b[1]-a[1]);
    if(sorted.length >= 2 && sorted[0][1] - sorted[sorted.length-1][1] > 30){
      insights.push({
        category:'sugar', priority:'medium', icon:'⏰',
        title:`السكر يرتفع أكثر في ${labels[sorted[0][0]]}`,
        details:`متوسط السكر في ${labels[sorted[0][0]]} هو ${sorted[0][1]} mg/dl، بينما في ${labels[sorted[sorted.length-1][0]]} هو ${sorted[sorted.length-1][1]} mg/dl`,
        suggestion: sorted[0][0]==='morning' ? 'فكر في تعديل وجبة الفطور أو دواء الصباح. ظاهرة الفجر (Dawn) شائعة في السكري' :
                    sorted[0][0]==='evening' ? 'راجع وجبة الغداء — قد تكون عالية الكربوهيدرات' :
                    sorted[0][0]==='night'   ? 'تجنب الوجبات الثقيلة قبل النوم' :
                    'راجع الوجبات في هذا الوقت',
      });
    }
  }

  // ────────── ANALYSIS 2: Day-of-week patterns ──────────
  if(m30.length >= 14){
    const byDay = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    m30.forEach(r => {
      const d = parseDate(r.date).getDay();
      byDay[d].push(r.value);
    });
    const dayAvgs = {};
    Object.entries(byDay).forEach(([d,v])=>{
      if(v.length>=2) dayAvgs[d] = Math.round(v.reduce((a,b)=>a+b,0)/v.length);
    });
    const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const sortedDays = Object.entries(dayAvgs).sort((a,b)=>b[1]-a[1]);
    if(sortedDays.length >= 3 && sortedDays[0][1] - sortedDays[sortedDays.length-1][1] > 25){
      insights.push({
        category:'sugar', priority:'medium', icon:'📅',
        title:`السكر يرتفع يوم ${dayNames[sortedDays[0][0]]}`,
        details:`متوسط السكر يوم ${dayNames[sortedDays[0][0]]}: ${sortedDays[0][1]} · يوم ${dayNames[sortedDays[sortedDays.length-1][0]]}: ${sortedDays[sortedDays.length-1][1]}`,
        suggestion:`فكّر: هل تختلف عاداتك يوم ${dayNames[sortedDays[0][0]]}؟ (وجبات خارجية، نشاط أقل، توتر...)`,
      });
    }
  }

  // ────────── ANALYSIS 3: Post-meal spike detection ──────────
  const postMeals = m30.filter(x=>x.marker==='1h'||x.marker==='2h');
  if(postMeals.length >= 5){
    const highSpikes = postMeals.filter(x=>x.value>180);
    if(highSpikes.length / postMeals.length > 0.4){
      insights.push({
        category:'meal', priority:'high', icon:'🍽',
        title:`ارتفاع السكر بعد ${highSpikes.length} وجبات`,
        details:`${Math.round(highSpikes.length/postMeals.length*100)}% من قياسات بعد الأكل تجاوزت 180 mg/dl`,
        suggestion:'قلل من الأرز والخبز الأبيض والحلويات. زد البروتين والخضار. تجنب العصائر',
      });
    }
  }

  // ────────── ANALYSIS 4: Dawn phenomenon — smart bed vs fasting comparison ──────────
  const dawnResult = analyzeDawnPhenomenon();
  if(dawnResult.triggered){
    if(dawnResult.pattern === 'dawn' && dawnResult.severity === 'severe'){
      insights.push({
        category:'sugar', priority:'high', icon:'🌅',
        title:'ظاهرة الفجر حرجة',
        details:`السكر يرتفع متوسط ${dawnResult.avgRise}+ نقطة أثناء النوم (من ${dawnResult.avgBed} → ${dawnResult.avgFast} mg/dl) في ${dawnResult.dawnDays} من ${dawnResult.pairs.length} ليلة`,
        suggestion:'استشر طبيبك فوراً: تعديل Metformin Extended-Release ليلاً، تخفيف وجبة العشاء، أو تعديل الجرعات',
      });
    } else if(dawnResult.pattern === 'dawn' && dawnResult.severity === 'moderate'){
      insights.push({
        category:'sugar', priority:'medium', icon:'🌅',
        title:'ظاهرة الفجر متوسطة',
        details:`ارتفاع ليلي متوسط ${dawnResult.avgRise} نقطة (${dawnResult.dawnDays} من ${dawnResult.pairs.length} ليلة)`,
        suggestion:'جرّب: المشي المسائي، تخفيف العشاء، مراجعة توقيت الدواء مع طبيبك',
      });
    } else if(dawnResult.pattern === 'dawn' && dawnResult.severity === 'mild'){
      insights.push({
        category:'sugar', priority:'low', icon:'🌅',
        title:'ظاهرة الفجر خفيفة',
        details:`ارتفاع ليلي طفيف ${dawnResult.avgRise} نقطة — ضمن الحدود المقبولة`,
        suggestion:'تابع القياسات ولا حاجة لتدخل الآن — أبلغ طبيبك في الزيارة القادمة',
      });
    } else if(dawnResult.pattern === 'somogyi'){
      insights.push({
        category:'sugar', priority:'high', icon:'🔄',
        title:'تأثير سوموجي محتمل',
        details:`انخفاض ليلي (${dawnResult.avgBed} mg/dl) ثم ارتفاع صباحي مفاجئ (+${dawnResult.avgRise}) — لا تزِد الجرعة!`,
        suggestion:'أبلغ طبيبك: قد تحتاج تخفيض جرعة الإنسولين المسائية أو وجبة خفيفة قبل النوم',
      });
    } else if(dawnResult.pattern === 'normal' && dawnResult.avgFast <= profile.targets.fastingMax){
      insights.push({
        category:'sugar', priority:'low', icon:'🎉',
        title:'ضبط ليلي ممتاز',
        details:`فرق بين النوم والصائم ${Math.abs(dawnResult.avgRise)} نقطة فقط — التحكم الليلي ممتاز`,
        suggestion:'استمر على نفس النمط',
      });
    }
  } else {
    // Fallback: basic fasting average check when no bed readings available
    const fastings = m30.filter(x=>x.marker==='fasting');
    if(fastings.length >= 5){
      const avgFast = Math.round(fastings.reduce((a,x)=>a+x.value,0)/fastings.length);
      if(avgFast > 130){
        insights.push({
          category:'sugar', priority:'high', icon:'🌅',
          title:'سكر الصائم مرتفع باستمرار',
          details:`متوسط سكر الصائم ${avgFast} mg/dl — سجّل قياس قبل النوم لتحليل ظاهرة الفجر`,
          suggestion:'ابدأ بتسجيل قياس سكر قبل النوم يومياً لمعرفة ما إذا كنت تعاني من ظاهرة الفجر',
        });
      } else if(avgFast <= profile.targets.fastingMax){
        insights.push({
          category:'sugar', priority:'low', icon:'🎉',
          title:'سكر الصائم ممتاز',
          details:`متوسط ${avgFast} mg/dl — ضمن الهدف`,
          suggestion:'استمر على نفس النمط',
        });
      }
    }
  }

  // ────────── ANALYSIS 5: Weight trend ──────────
  if(weightLog.length >= 4){
    const recent = weightLog.slice(0,3).reduce((a,x)=>a+x.weight,0)/3;
    const older = weightLog.slice(-3).reduce((a,x)=>a+x.weight,0)/3;
    const diff = recent - older;
    const days = (parseDate(weightLog[0].date) - parseDate(weightLog[weightLog.length-1].date)) / 86400000;
    if(days > 14){
      const monthlyRate = (diff / days * 30).toFixed(1);
      if(monthlyRate < -1){
        insights.push({
          category:'weight', priority:'low', icon:'📉',
          title:'الوزن ينخفض بمعدل صحي',
          details:`خسرت ${Math.abs(monthlyRate)} كجم/شهر — معدل ممتاز (الموصى به 0.5-1 كجم/أسبوع)`,
          suggestion:'استمر على نفس الخطة. عند خسارة 5-10% من الوزن، السكر يتحسن كثيراً',
        });
      } else if(monthlyRate > 1){
        insights.push({
          category:'weight', priority:'medium', icon:'⚖️',
          title:'الوزن يزيد',
          details:`زاد ${monthlyRate} كجم/شهر`,
          suggestion:'راجع: السعرات اليومية، النشاط البدني، نوعية الطعام. زيادة الوزن تزيد مقاومة الإنسولين',
        });
      }
    }
  }

  // ────────── ANALYSIS 6: Activity correlation with sugar ──────────
  const activeDays = lastNDays(30).filter(d =>
    activityLog.some(a => a.date === d && a.duration >= 20)
  );
  const inactiveDays = lastNDays(30).filter(d =>
    !activityLog.some(a => a.date === d && a.duration >= 20)
  );
  if(activeDays.length >= 5 && inactiveDays.length >= 5){
    const activeSugar = m30.filter(s => activeDays.includes(s.date));
    const inactiveSugar = m30.filter(s => inactiveDays.includes(s.date));
    if(activeSugar.length >= 3 && inactiveSugar.length >= 3){
      const avgActive = Math.round(activeSugar.reduce((a,x)=>a+x.value,0)/activeSugar.length);
      const avgInactive = Math.round(inactiveSugar.reduce((a,x)=>a+x.value,0)/inactiveSugar.length);
      if(avgInactive - avgActive > 15){
        insights.push({
          category:'activity', priority:'medium', icon:'🏃',
          title:'النشاط يخفض سكرك بوضوح',
          details:`متوسط السكر في أيام النشاط: ${avgActive} · في أيام الخمول: ${avgInactive} (فرق ${avgInactive-avgActive} نقطة)`,
          suggestion:'استهدف 30 دقيقة مشي يومياً — لها تأثير قوي على السكر',
        });
      }
    }
  }

  // ────────── ANALYSIS 7: Medication adherence ──────────
  const week14 = lastNDays(14);
  const expectedDoses = meds.filter(m=>m.active).reduce((a,m)=>a+(m.times?.length||1),0) * 14;
  const actualDoses = medLog.filter(x => week14.includes(x.date)).length;
  if(expectedDoses > 0){
    const adherence = Math.round(actualDoses / expectedDoses * 100);
    if(adherence < 70){
      insights.push({
        category:'meds', priority:'high', icon:'💊',
        title:`الالتزام بالأدوية ${adherence}% فقط`,
        details:`خلال آخر 14 يوم، أخذت ${actualDoses} من ${expectedDoses} جرعة`,
        suggestion:'فعّل تذكيرات الأدوية. عدم الانتظام يسبب ارتفاع HbA1c والمضاعفات',
      });
    } else if(adherence >= 90){
      insights.push({
        category:'meds', priority:'low', icon:'✅',
        title:`التزام ممتاز بالأدوية (${adherence}%)`,
        details:`${actualDoses} من ${expectedDoses} جرعة في 14 يوم`,
        suggestion:'هذا أساس التحكم الجيد بالسكر — أحسنت',
      });
    }
  }

  // ────────── ANALYSIS 8: HbA1c trend (lab-based) ──────────
  const labsWithA1c = getAllLabs().filter(x=>x.hba1c).sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  if(labsWithA1c.length >= 2){
    const first = labsWithA1c[0];
    const last = labsWithA1c[labsWithA1c.length-1];
    const change = last.hba1c - first.hba1c;
    const monthsBetween = (parseDate(last.date) - parseDate(first.date)) / (86400000 * 30);
    if(monthsBetween >= 3){
      if(change <= -1){
        insights.push({
          category:'labs', priority:'low', icon:'🎉',
          title:`HbA1c تحسن بشكل ممتاز`,
          details:`من ${first.hba1c}% (${first.date}) إلى ${last.hba1c}% (${last.date}) — تحسن ${Math.abs(change).toFixed(1)} نقطة`,
          suggestion:'تحسن HbA1c بنقطة واحدة يقلل خطر المضاعفات بـ 35%. استمر!',
        });
      } else if(change >= 0.5){
        insights.push({
          category:'labs', priority:'high', icon:'📈',
          title:`HbA1c يتدهور`,
          details:`من ${first.hba1c}% إلى ${last.hba1c}% — زيادة ${change.toFixed(1)} نقطة`,
          suggestion:'حدّد موعد مع طبيبك — قد تحتاج تعديل الخطة العلاجية',
        });
      }
    }
  }

  // ────────── ANALYSIS 9: TIR-based recommendation ──────────
  const tir = calcTIR(m30);
  if(tir && tir.total >= 14){
    if(tir.inRange >= 70){
      insights.push({
        category:'sugar', priority:'low', icon:'🏆',
        title:'تحكم ممتاز — ضمن الهدف الذهبي',
        details:`${tir.inRange}% من الوقت داخل الهدف (الموصى به ≥70%)`,
        suggestion:'تحكمك يضعك ضمن أفضل 10% من مرضى السكري عالمياً. حافظ على هذا المستوى',
      });
    } else if(tir.inRange < 50){
      insights.push({
        category:'sugar', priority:'high', icon:'⚠️',
        title:'وقت قصير داخل الهدف',
        details:`فقط ${tir.inRange}% من الوقت ضمن الهدف`,
        suggestion:'الهدف هو ≥70%. ركّز على: تناول الدواء بانتظام، تقليل النشويات، زيادة المشي',
      });
    }
    if(tir.veryLow + tir.low > 4){
      insights.push({
        category:'sugar', priority:'high', icon:'🚨',
        title:'هبوطات متكررة',
        details:`${tir.veryLow + tir.low}% من الوقت سكرك تحت 70 (الموصى به <4%)`,
        suggestion:'احمل دائماً سكر سريع المفعول. ناقش طبيبك في تقليل جرعة الإنسولين أو الدواء',
      });
    }
  }

  // ────────── ANALYSIS 10: Foot exam reminders ──────────
  const lastFoot = screeningLog.filter(x=>x.type==='foot').sort((a,b)=>parseDate(b.date)-parseDate(a.date))[0];
  if(!lastFoot){
    insights.push({
      category:'screening', priority:'medium', icon:'🦶',
      title:'لم تفحص قدميك بعد',
      details:'فحص القدم الشهري يقي 90% من حالات بتر القدم السكرية',
      suggestion:'افحص قدميك الآن من تبويب "فحوصات السكري" — يستغرق 3 دقائق فقط',
    });
  }

  // ────────── ANALYSIS 11: BP-sugar correlation ──────────
  const recentBPs = bpLog.filter(x=>within(x.date,30));
  if(recentBPs.length >= 5){
    const highBP = recentBPs.filter(b => b.sys >= 140 || b.dia >= 90).length;
    if(highBP / recentBPs.length > 0.3){
      insights.push({
        category:'bp', priority:'high', icon:'💓',
        title:`ضغط مرتفع في ${highBP} من ${recentBPs.length} قياسات`,
        details:`${Math.round(highBP/recentBPs.length*100)}% من قياسات الضغط فوق الهدف`,
        suggestion:'الضغط + السكر معاً يضاعفان خطر الجلطات بـ 4 مرات. راجع طبيبك',
      });
    }
  }

  // ────────── ANALYSIS 12: Water intake ──────────
  const wDays = lastNDays(7).map(d => waterLog.filter(x=>x.date===d).reduce((a,w)=>a+w.cups,0));
  const avgWater = wDays.reduce((a,b)=>a+b,0) / 7;
  if(avgWater < 5){
    insights.push({
      category:'water', priority:'low', icon:'💧',
      title:`شرب الماء قليل (${avgWater.toFixed(1)} كوب/يوم)`,
      details:'الجفاف يرفع السكر ويضغط الكلى',
      suggestion:`الهدف ${profile.targets.waterCups} أكواب يومياً — اشرب كوب ماء مع كل قياس سكر`,
    });
  }

  // Sort by priority: high → medium → low
  const order = {high:0, medium:1, low:2};
  insights.sort((a,b) => order[a.priority] - order[b.priority]);

  // ────────── Kidney ACR / eGFR alert ──────────
  const allLabsK = getAllLabs();
  const lastLabK = allLabsK.slice(-1)[0];
  if(lastLabK){
    const egfrK = lastLabK.cr ? calcEGFR(lastLabK.cr, profile.age||43, profile.gender||'male') : null;
    if(lastLabK.acr && lastLabK.acr > 30){
      insights.push({category:'kidney',priority:'high',icon:'🫘',
        title:'نسبة ACR مرتفعة — تنبيه كلوي',
        details:`ACR = ${lastLabK.acr} mg/g (الطبيعي < 30) · ${lastLabK.date}`,
        suggestion:'أبلغ طبيبك. أعد اختبار microalbumin من بول الصباح. حافظ على ضغط الدم < 130/80',
      });
    } else if(lastLabK.malb && lastLabK.malb > 16.7){
      insights.push({category:'kidney',priority:'medium',icon:'💧',
        title:'ميكروألبومين مرتفع طفيفاً',
        details:`Microalbumin = ${lastLabK.malb} mg/L (الطبيعي < 16.7) · ${lastLabK.date}`,
        suggestion:'أعد اختبار microalbumin من بول الصباح الباكر. راجع ضغط الدم',
      });
    }
    if(egfrK && egfrK < 60){
      insights.push({category:'kidney',priority:'high',icon:'🫘',
        title:`eGFR منخفض (${egfrK} mL/min)`,
        details:`محسوب من كرياتينين ${lastLabK.cr} — المرحلة: ${eGFRStage(egfrK).label}`,
        suggestion:'استشر طبيب الكلى. تجنب مضادات الالتهاب. راجع جرعة Metformin',
      });
    }
  }


  return insights;
}

//  PAGE: AI INSIGHTS
// ════════════════════════════════════════════════════════════════
RENDERERS.insights = function(){
  const insights = analyzePatterns();
  const byPriority = {
    high: insights.filter(i => i.priority === 'high'),
    medium: insights.filter(i => i.priority === 'medium'),
    low: insights.filter(i => i.priority === 'low'),
  };

  document.getElementById('page-insights').innerHTML = `
    <div class="card" style="background:linear-gradient(135deg,#1a0a2a 0%,#0a1628 100%);border-color:#a855f7">
      <div class="card-title" style="color:#c084fc"><span class="ct-icon">🧠</span>المساعد الذكي</div>
      <div class="txt-sm" style="color:#cbd5e1;line-height:1.7">
        يحلل بياناتك تلقائياً ويكتشف الأنماط ويعطيك توصيات شخصية بناءً على وضعك الفعلي.<br>
        <b style="color:#4ade80">يعمل محلياً 100%</b> — بياناتك لا تغادر جهازك.
      </div>

// ════════════════════════════════════════════════════
//  DAWN CARD RENDERER — called from sugar tab template
// ════════════════════════════════════════════════════
function renderHealthScoreWidget(){
  const hs = calcHealthScore();
  if(!hs) return `<div class="card" style="border-color:#334155;text-align:center;padding:20px">
    <div style="font-size:28px;margin-bottom:8px">📊</div>
    <div style="font-size:13px;font-weight:700;color:#94a3b8">سجّل قياسات لتفعيل المؤشر الصحي</div>
    </div>`;

  const {composite, grade, scores} = hs;
  const circleR = 38, circum = 2*Math.PI*circleR;
  const dash = (composite/100)*circum;

  let bars = scores.map(s=>{
    const bw = Math.round(s.score);
    const col = s.score>=80?'#4ade80':s.score>=60?'#10b981':s.score>=40?'#fbbf24':s.score>=20?'#f97316':'#f87171';
    return `<div style="margin-bottom:7px">
      <div style="display:flex;justify-content:space-between;margin-bottom:3px">
        <span style="font-size:11px;color:#94a3b8">${s.icon} ${s.name}</span>
        <span style="font-size:11px;font-weight:700;color:${col}">${s.val}</span>
      </div>
      <div style="height:6px;background:#1e293b;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${bw}%;background:${col};border-radius:3px;transition:width .4s"></div>
      </div>
    </div>`;
  }).join('');

  return `<div class="card" style="border-color:${grade.c}44">
    <div class="card-title flex-between">
      <span style="color:${grade.c}"><span class="ct-icon">📊</span>المؤشر الصحي الشامل</span>
      <span class="badge" style="background:${grade.bg};color:${grade.c};border:1px solid ${grade.c}44">${grade.l}</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">
      <svg width="90" height="90" style="flex-shrink:0">
        <circle cx="45" cy="45" r="${circleR}" fill="none" stroke="#1e293b" stroke-width="7"/>
        <circle cx="45" cy="45" r="${circleR}" fill="none" stroke="${grade.c}" stroke-width="7"
          stroke-dasharray="${dash.toFixed(1)} ${circum.toFixed(1)}"
          stroke-dashoffset="${(circum/4).toFixed(1)}"
          stroke-linecap="round"/>
        <text x="45" y="41" text-anchor="middle" font-size="22" font-weight="900" fill="${grade.c}">${composite}</text>
        <text x="45" y="56" text-anchor="middle" font-size="10" fill="#64748b">من 100</text>
      </svg>
      <div style="flex:1">
        <div style="font-size:11px;color:#64748b;margin-bottom:6px">آخر تحديث: ${hs.lastUpdated||'—'}</div>
        ${bars}
      </div>
    </div>
  </div>`;
}


// ════════════════════════════════════════════════════
//  LAB COMPARISON TOOL
// ════════════════════════════════════════════════════
// ════════════════════════════════════════════════════
//  LAB COMPARISON — مقارنة جلستين
//  Interactive: pick two lab dates, see side-by-side diff
// ════════════════════════════════════════════════════
let labCmpA = null;
let labCmpB = null;

function renderLabComparison(idx1, idx2){
  const all = getAllLabs();
  if(all.length < 2) return '';

  // Default: most recent vs previous
  if(labCmpA === null) labCmpA = all.length - 2;
  if(labCmpB === null) labCmpB = all.length - 1;
  labCmpA = Math.max(0, Math.min(labCmpA, all.length - 1));
  labCmpB = Math.max(0, Math.min(labCmpB, all.length - 1));

  const A = all[labCmpA];
  const B = all[labCmpB];

  const age = profile.age || 43;
  const gender = profile.gender || 'male';

  const rows = [
    // Sugar
    { group:'🍬 السكر', key:'hba1c',    label:'HbA1c',          unit:'%',      goodDir:'down', ok:v=>v<=5.7,  warn:v=>v<=6.4 },
    { group:'🍬 السكر', key:'fbs',      label:'سكر صائم',       unit:'mg/dl',  goodDir:'down', ok:v=>v>=65&&v<=110, warn:v=>v<=125 },
    // Lipids
    { group:'🩸 الدهون', key:'ldl',     label:'LDL',            unit:'mg/dl',  goodDir:'down', ok:v=>v<=100,  warn:v=>v<=129 },
    { group:'🩸 الدهون', key:'hdl',     label:'HDL',            unit:'mg/dl',  goodDir:'up',   ok:v=>v>=40,   warn:v=>v>=35  },
    { group:'🩸 الدهون', key:'chol',    label:'كوليسترول كلي',  unit:'mg/dl',  goodDir:'down', ok:v=>v<=200,  warn:v=>v<=239 },
    { group:'🩸 الدهون', key:'tg',      label:'ثلاثيات TG',     unit:'mg/dl',  goodDir:'down', ok:v=>v<=150,  warn:v=>v<=199 },
    // Kidney
    { group:'🫘 الكلى',  key:'cr',      label:'كرياتينين',      unit:'mg/dl',  goodDir:'neutral', ok:v=>v>=0.7&&v<=1.3 },
    { group:'🫘 الكلى',  key:'egfr_c',  label:'eGFR (محسوب)',   unit:'mL/min', goodDir:'up',   ok:v=>v>=90,   warn:v=>v>=60,
      compute: l => l.cr ? calcEGFR(l.cr, age, gender) : null },
    { group:'🫘 الكلى',  key:'bun',     label:'BUN يوريا',      unit:'mg/dl',  goodDir:'neutral', ok:v=>v>=9&&v<=20 },
    { group:'🫘 الكلى',  key:'malb',    label:'ميكروألبومين',   unit:'mg/L',   goodDir:'down', ok:v=>v<=16.7, warn:v=>v<=30 },
    { group:'🫘 الكلى',  key:'acr',     label:'ACR',            unit:'mg/g',   goodDir:'down', ok:v=>v<=30,   warn:v=>v<=300 },
    // Liver
    { group:'🟡 الكبد',  key:'alt',     label:'ALT/SGPT',       unit:'U/L',    goodDir:'down', ok:v=>v>=9&&v<=50 },
    { group:'🟡 الكبد',  key:'ast',     label:'AST/SGOT',       unit:'U/L',    goodDir:'down', ok:v=>v>=17&&v<=59 },
  ];

  // Date picker buttons
  const btnStyle = (idx, sel) => `style="background:${idx===sel?'#06b6d4':'#0f172a'};border:1px solid ${idx===sel?'#06b6d4':'#334155'};border-radius:7px;padding:4px 9px;color:${idx===sel?'white':'#94a3b8'};font:inherit;font-size:11px;cursor:pointer;font-weight:${idx===sel?'700':'400'}"`;

  const pickerA = all.map((l,i)=>`<button onclick="labCmpA=${i};RENDERERS.labs()" ${btnStyle(i,labCmpA)}>${l.date.slice(0,7)}</button>`).join('');
  const pickerB = all.map((l,i)=>`<button onclick="labCmpB=${i};RENDERERS.labs()" ${btnStyle(i,labCmpB)}>${l.date.slice(0,7)}</button>`).join('');

  // Build comparison rows grouped
  let lastGroup = null;
  const tableRows = rows.map(r => {
    const vA = r.compute ? r.compute(A) : A[r.key];
    const vB = r.compute ? r.compute(B) : B[r.key];
    if(vA == null && vB == null) return '';

    const fA = vA != null ? (Number.isInteger(vA) ? vA : parseFloat(vA).toFixed(vA >= 10 ? 1 : 2)) : '—';
    const fB = vB != null ? (Number.isInteger(vB) ? vB : parseFloat(vB).toFixed(vB >= 10 ? 1 : 2)) : '—';

    // Status colors for each value
    const colA = vA==null?'#64748b': r.ok(parseFloat(vA))?'#4ade80': r.warn&&r.warn(parseFloat(vA))?'#fbbf24':'#f87171';
    const colB = vB==null?'#64748b': r.ok(parseFloat(vB))?'#4ade80': r.warn&&r.warn(parseFloat(vB))?'#fbbf24':'#f87171';

    // Diff arrow
    let arrow = '', diffVal = '', arrowCol = '#64748b';
    if(vA != null && vB != null){
      const diff = +(parseFloat(vB) - parseFloat(vA)).toFixed(2);
      const absDiff = Math.abs(diff);
      diffVal = (diff > 0 ? '+' : '') + (absDiff >= 10 ? Math.round(diff) : diff.toFixed(2));
      if(Math.abs(diff) < 0.01){ arrow = '→'; arrowCol = '#64748b'; }
      else {
        const improved = r.goodDir === 'down' ? diff < 0 : r.goodDir === 'up' ? diff > 0 : null;
        arrow = diff > 0 ? '↑' : '↓';
        arrowCol = improved === null ? '#94a3b8' : improved ? '#4ade80' : '#f87171';
      }
    }

    const groupHeader = r.group !== lastGroup
      ? `<tr><td colspan="4" style="padding:8px 6px 4px;font-size:10px;font-weight:700;color:#94a3b8;border-bottom:1px solid #334155">${r.group}</td></tr>`
      : '';
    lastGroup = r.group;

    return groupHeader + `<tr style="border-bottom:1px solid #1a2940">
      <td style="padding:6px;font-size:11px;color:#94a3b8">${r.label}<br><span style="font-size:9px;color:#475569">${r.unit}</span></td>
      <td style="padding:6px;text-align:center;font-size:14px;font-weight:900;color:${colA}">${fA}</td>
      <td style="padding:6px;text-align:center;font-size:14px;font-weight:900;color:${colB}">${fB}</td>
      <td style="padding:6px;text-align:center">
        ${arrow ? `<span style="font-size:14px;font-weight:900;color:${arrowCol}">${arrow}</span>` : ''}
        ${diffVal ? `<br><span style="font-size:9px;color:${arrowCol}">${diffVal}</span>` : ''}
      </td>
    </tr>`;
  }).filter(Boolean).join('');

  // Summary: how many improved vs worsened
  let impCount = 0, worCount = 0;
  rows.forEach(r => {
    const vA = r.compute ? r.compute(A) : A[r.key];
    const vB = r.compute ? r.compute(B) : B[r.key];
    if(vA == null || vB == null || r.goodDir === 'neutral') return;
    const diff = parseFloat(vB) - parseFloat(vA);
    if(Math.abs(diff) < 0.01) return;
    const improved = r.goodDir === 'down' ? diff < 0 : diff > 0;
    if(improved) impCount++; else worCount++;
  });

  // Time between sessions
  const dA = A.date, dB = B.date;
  const daysBetween = Math.round(Math.abs(parseDate(dB) - parseDate(dA)) / 86400000);
  const monthsBetween = Math.round(daysBetween / 30);

  return `<div class="card" style="border-color:#0ea5e944">
    <div class="card-title" style="color:#38bdf8"><span class="ct-icon">🔍</span>مقارنة جلستين</div>

    <div style="margin-bottom:10px">
      <div style="font-size:10px;color:#64748b;margin-bottom:5px">الجلسة الأولى (A):</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${pickerA}</div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:10px;color:#64748b;margin-bottom:5px">الجلسة الثانية (B):</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${pickerB}</div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <div style="flex:1;background:#0f172a;border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:#64748b">A · ${A.hosp||'—'}</div>
        <div style="font-size:13px;font-weight:800;color:#94a3b8">${dA}</div>
      </div>
      <div style="font-size:11px;color:#64748b;flex-shrink:0">${monthsBetween} شهر</div>
      <div style="flex:1;background:#0c2a47;border-radius:9px;padding:10px;text-align:center;border:1px solid #0ea5e944">
        <div style="font-size:9px;color:#06b6d4">B · ${B.hosp||'—'}</div>
        <div style="font-size:13px;font-weight:800;color:#38bdf8">${dB}</div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:#052e16;border-radius:8px;padding:8px;text-align:center;border:1px solid #166534">
        <div style="font-size:18px;font-weight:900;color:#4ade80">${impCount}</div>
        <div style="font-size:10px;color:#4ade80">مؤشر تحسّن</div>
      </div>
      <div style="flex:1;background:${worCount>0?'#450a0a':'#0f172a'};border-radius:8px;padding:8px;text-align:center;border:1px solid ${worCount>0?'#991b1b':'#1e293b'}">
        <div style="font-size:18px;font-weight:900;color:${worCount>0?'#f87171':'#64748b'}">${worCount}</div>
        <div style="font-size:10px;color:${worCount>0?'#f87171':'#64748b'}">مؤشر ارتفع</div>
      </div>
      <div style="flex:1;background:#1e293b;border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:18px;font-weight:900;color:#64748b">${rows.filter(r=>{ const va=r.compute?r.compute(A):A[r.key]; const vb=r.compute?r.compute(B):B[r.key]; return va!=null&&vb!=null&&Math.abs(parseFloat(vb)-parseFloat(va))<0.01; }).length}</div>
        <div style="font-size:10px;color:#64748b">لم يتغير</div>
      </div>
    </div>

    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="background:#1e293b">
            <th style="padding:6px;text-align:right;font-size:10px;color:#64748b;border-bottom:1px solid #334155;font-weight:600">المؤشر</th>
            <th style="padding:6px;text-align:center;font-size:10px;color:#94a3b8;border-bottom:1px solid #334155;font-weight:600">A<br><span style="color:#475569">${dA.slice(0,7)}</span></th>
            <th style="padding:6px;text-align:center;font-size:10px;color:#38bdf8;border-bottom:1px solid #334155;font-weight:600">B<br><span style="color:#0ea5e9">${dB.slice(0,7)}</span></th>
            <th style="padding:6px;text-align:center;font-size:10px;color:#64748b;border-bottom:1px solid #334155;font-weight:600">B−A</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    <div style="margin-top:8px;font-size:10px;color:#475569;line-height:1.7;padding:6px 8px;background:#0f172a;border-radius:6px">
      ↑ ارتفاع · ↓ انخفاض · <span style="color:#4ade80">أخضر = تحسن</span> · <span style="color:#f87171">أحمر = تراجع</span> · <span style="color:#64748b">رمادي = محايد</span>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════
//  TREND INDICATOR WIDGET — "مؤشر الاتجاه الشامل"
//  Shows every key health metric: current value, prev value,
//  colored direction arrow, mini sparkline, status badge
// ════════════════════════════════════════════════════
function renderTrendIndicator(){
  const allLabs = getAllLabs();
  if(allLabs.length < 2) return '';

  const age = profile.age || 43;
  const gender = profile.gender || 'male';

  // Build metric definitions — each has: key, label, unit, goodDir, refs, format, source
  const labMetrics = [
    { id:'hba1c',    label:'HbA1c',          unit:'%',        goodDir:'down',
      ok:v=>v<=5.7,  warn:v=>v<=6.4,
      refs:[{v:5.7,l:'طبيعي'},{v:6.4,l:'ما قبل السكري'},{v:8,l:'سكري غير متحكم'}],
      format:v=>v.toFixed(2), icon:'🍬' },
    { id:'fbs',      label:'سكر صائم',       unit:'mg/dl',    goodDir:'down',
      ok:v=>v>=65&&v<=110, warn:v=>v<=125,
      format:v=>Math.round(v), icon:'🌅' },
    { id:'egfr_calc',label:'eGFR',           unit:'mL/min',   goodDir:'up',
      ok:v=>v>=90, warn:v=>v>=60,
      format:v=>Math.round(v), icon:'🫘',
      compute: l => l.cr ? calcEGFR(l.cr, age, gender) : null },
    { id:'cr',       label:'كرياتينين',      unit:'mg/dl',    goodDir:'neutral',
      ok:v=>v>=0.7&&v<=1.3, warn:v=>v>=0.5,
      format:v=>v.toFixed(2), icon:'🫘' },
    { id:'acr',      label:'ACR',            unit:'mg/g',     goodDir:'down',
      ok:v=>v<=30, warn:v=>v<=300,
      format:v=>v.toFixed(1), icon:'💧' },
    { id:'malb',     label:'ميكروألبومين',   unit:'mg/L',     goodDir:'down',
      ok:v=>v<=16.7, warn:v=>v<=30,
      format:v=>v.toFixed(1), icon:'💧' },
    { id:'ldl',      label:'LDL',            unit:'mg/dl',    goodDir:'down',
      ok:v=>v<=100, warn:v=>v<=129,
      format:v=>Math.round(v), icon:'🩸' },
    { id:'hdl',      label:'HDL',            unit:'mg/dl',    goodDir:'up',
      ok:v=>v>=40, warn:v=>v>=35,
      format:v=>Math.round(v), icon:'🩸' },
    { id:'chol',     label:'كوليسترول',      unit:'mg/dl',    goodDir:'down',
      ok:v=>v<=200, warn:v=>v<=239,
      format:v=>Math.round(v), icon:'🩸' },
    { id:'tg',       label:'ثلاثيات TG',     unit:'mg/dl',    goodDir:'down',
      ok:v=>v<=150, warn:v=>v<=199,
      format:v=>Math.round(v), icon:'🩸' },
    { id:'alt',      label:'ALT/SGPT',       unit:'U/L',      goodDir:'down',
      ok:v=>v>=9&&v<=50, format:v=>Math.round(v), icon:'🟡' },
    { id:'ast',      label:'AST/SGOT',       unit:'U/L',      goodDir:'down',
      ok:v=>v>=17&&v<=59, format:v=>Math.round(v), icon:'🟡' },
  ];

  // Collect values for each metric across all labs
  const metrics = labMetrics.map(m => {
    const vals = allLabs.map(l => {
      const v = m.compute ? m.compute(l) : l[m.id];
      return v != null ? { date: l.date, v: parseFloat(v), formatted: m.format(parseFloat(v)) } : null;
    }).filter(Boolean);

    if(!vals.length) return null;
    const curr = vals[vals.length - 1];
    const prev = vals.length > 1 ? vals[vals.length - 2] : null;
    const first = vals[0];
    const diff = prev ? +(curr.v - prev.v).toFixed(2) : null;
    const diffFromFirst = +(curr.v - first.v).toFixed(2);
    const pct = prev ? Math.round(Math.abs(diff / prev.v) * 100) : null;
    const dir = diff === null ? null : diff > 0.005 ? 'up' : diff < -0.005 ? 'down' : 'same';

    // Status based on current value
    const isOk   = m.ok ? m.ok(curr.v) : true;
    const isWarn  = !isOk && m.warn ? m.warn(curr.v) : false;
    const status  = isOk ? 'ok' : isWarn ? 'warn' : 'bad';
    const col     = status === 'ok' ? '#4ade80' : status === 'warn' ? '#fbbf24' : '#f87171';

    // Is the trend direction good?
    let trendGood = null;
    if(dir && dir !== 'same' && m.goodDir !== 'neutral'){
      trendGood = m.goodDir === 'down' ? dir === 'down' : dir === 'up';
    }
    const trendCol = dir === 'same' ? '#64748b' : trendGood === null ? '#94a3b8' : trendGood ? '#4ade80' : '#f87171';
    const arrowIcon = dir === 'up' ? '↑' : dir === 'down' ? '↓' : dir === 'same' ? '→' : '';

    return { ...m, vals, curr, prev, first, diff, diffFromFirst, pct, dir, status, col, trendGood, trendCol, arrowIcon };
  }).filter(Boolean);

  if(!metrics.length) return '';

  // Group by organ system
  const groups = [
    { title:'🍬 السكر وما قبله',  ids:['hba1c','fbs'],                        col:'#38bdf8' },
    { title:'🫘 الكلى',           ids:['egfr_calc','cr','acr','malb'],         col:'#a78bfa' },
    { title:'🩸 الدهون',          ids:['ldl','hdl','chol','tg'],               col:'#fb923c' },
    { title:'🟡 الكبد',           ids:['alt','ast'],                           col:'#4ade80' },
  ];

  // Build sparkline SVG for a metric's value history
  function sparkline(vals, col, goodDir){
    if(vals.length < 2) return '';
    const W = 60, H = 24, PAD = 2;
    const vs = vals.map(v => v.v);
    const mn = Math.min(...vs), mx = Math.max(...vs);
    const range = mx - mn || 1;
    const pts = vs.map((v, i) => {
      const x = PAD + (i / (vs.length - 1)) * (W - PAD * 2);
      const y = H - PAD - ((v - mn) / range) * (H - PAD * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const lastX = parseFloat(pts.split(' ').pop().split(',')[0]);
    const lastY = parseFloat(pts.split(' ').pop().split(',')[1]);
    const dotCol = vals.length > 1 ? col : '#475569';
    return `<svg width="${W}" height="${H}" style="display:block;flex-shrink:0">
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>
      <circle cx="${lastX}" cy="${lastY}" r="2.5" fill="${dotCol}"/>
    </svg>`;
  }

  // Build one metric row
  function metricRow(m){
    const spark = sparkline(m.vals, m.trendCol, m.goodDir);
    const diffStr = m.diff !== null ? `${m.diff > 0 ? '+' : ''}${m.format(m.diff)}` : '';
    const fromFirstStr = m.diffFromFirst !== 0
      ? `${m.diffFromFirst > 0 ? '+' : ''}${m.format(m.diffFromFirst)} منذ البداية`
      : 'لم يتغير منذ البداية';

    return `<div style="display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #1e293b">
      <div style="width:3px;height:36px;border-radius:2px;background:${m.col};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;color:#94a3b8;margin-bottom:1px">${m.icon} ${m.label}</div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span style="font-size:19px;font-weight:900;color:${m.col}">${m.curr.formatted}</span>
          <span style="font-size:10px;color:#64748b">${m.unit}</span>
          ${m.arrowIcon ? `<span style="font-size:14px;font-weight:900;color:${m.trendCol}">${m.arrowIcon}</span>` : ''}
          ${diffStr ? `<span style="font-size:10px;color:${m.trendCol}">${diffStr}</span>` : ''}
        </div>
        <div style="font-size:9px;color:#475569;margin-top:1px">${m.prev ? m.prev.date : m.curr.date} → ${m.curr.date}</div>
      </div>
      <div style="text-align:left;flex-shrink:0">
        ${spark}
        <div style="font-size:8px;color:#475569;margin-top:2px;text-align:center">${fromFirstStr}</div>
      </div>
    </div>`;
  }

  // Overall improvement count
  const improved = metrics.filter(m => m.trendGood === true).length;
  const worsened = metrics.filter(m => m.trendGood === false).length;
  const stable   = metrics.filter(m => m.dir === 'same').length;

  const groupHtml = groups.map(g => {
    const gMetrics = metrics.filter(m => g.ids.includes(m.id));
    if(!gMetrics.length) return '';
    return `<div style="margin-bottom:4px">
      <div style="font-size:11px;font-weight:700;color:${g.col};padding:8px 0 4px;border-bottom:1px solid #1e293b33">${g.title}</div>
      ${gMetrics.map(metricRow).join('')}
    </div>`;
  }).join('');

  return `<div class="card" style="border-color:#06b6d444">
    <div class="card-title flex-between">
      <span style="color:#06b6d4"><span class="ct-icon">📐</span>مؤشر الاتجاه الشامل</span>
      <div style="display:flex;gap:6px">
        <span style="font-size:10px;background:#052e16;color:#4ade80;padding:2px 7px;border-radius:10px;border:1px solid #166534">↓ ${improved} تحسّن</span>
        ${worsened?`<span style="font-size:10px;background:#450a0a;color:#f87171;padding:2px 7px;border-radius:10px;border:1px solid #991b1b">↑ ${worsened} ارتفع</span>`:''}
      </div>
    </div>
    <div style="font-size:11px;color:#64748b;margin-bottom:10px">مقارنة آخر جلستين من التحاليل · ${allLabs[allLabs.length-1]?.date} (الأحدث)</div>
    ${groupHtml}
  </div>`;
}


// ════════════════════════════════════════════════════
//  LAB COMPARISON — مقارنة جلستين
//  Interactive: pick two lab dates, see side-by-side diff
// ════════════════════════════════════════════════════

function renderLabCompare(){
  const all = getAllLabs();
  if(all.length < 2) return '';

  // Default: most recent vs previous
  if(labCmpA === null) labCmpA = all.length - 2;
  if(labCmpB === null) labCmpB = all.length - 1;
  labCmpA = Math.max(0, Math.min(labCmpA, all.length - 1));
  labCmpB = Math.max(0, Math.min(labCmpB, all.length - 1));

  const A = all[labCmpA];
  const B = all[labCmpB];

  const age = profile.age || 43;
  const gender = profile.gender || 'male';

  const rows = [
    // Sugar
    { group:'🍬 السكر', key:'hba1c',    label:'HbA1c',          unit:'%',      goodDir:'down', ok:v=>v<=5.7,  warn:v=>v<=6.4 },
    { group:'🍬 السكر', key:'fbs',      label:'سكر صائم',       unit:'mg/dl',  goodDir:'down', ok:v=>v>=65&&v<=110, warn:v=>v<=125 },
    // Lipids
    { group:'🩸 الدهون', key:'ldl',     label:'LDL',            unit:'mg/dl',  goodDir:'down', ok:v=>v<=100,  warn:v=>v<=129 },
    { group:'🩸 الدهون', key:'hdl',     label:'HDL',            unit:'mg/dl',  goodDir:'up',   ok:v=>v>=40,   warn:v=>v>=35  },
    { group:'🩸 الدهون', key:'chol',    label:'كوليسترول كلي',  unit:'mg/dl',  goodDir:'down', ok:v=>v<=200,  warn:v=>v<=239 },
    { group:'🩸 الدهون', key:'tg',      label:'ثلاثيات TG',     unit:'mg/dl',  goodDir:'down', ok:v=>v<=150,  warn:v=>v<=199 },
    // Kidney
    { group:'🫘 الكلى',  key:'cr',      label:'كرياتينين',      unit:'mg/dl',  goodDir:'neutral', ok:v=>v>=0.7&&v<=1.3 },
    { group:'🫘 الكلى',  key:'egfr_c',  label:'eGFR (محسوب)',   unit:'mL/min', goodDir:'up',   ok:v=>v>=90,   warn:v=>v>=60,
      compute: l => l.cr ? calcEGFR(l.cr, age, gender) : null },
    { group:'🫘 الكلى',  key:'bun',     label:'BUN يوريا',      unit:'mg/dl',  goodDir:'neutral', ok:v=>v>=9&&v<=20 },
    { group:'🫘 الكلى',  key:'malb',    label:'ميكروألبومين',   unit:'mg/L',   goodDir:'down', ok:v=>v<=16.7, warn:v=>v<=30 },
    { group:'🫘 الكلى',  key:'acr',     label:'ACR',            unit:'mg/g',   goodDir:'down', ok:v=>v<=30,   warn:v=>v<=300 },
    // Liver
    { group:'🟡 الكبد',  key:'alt',     label:'ALT/SGPT',       unit:'U/L',    goodDir:'down', ok:v=>v>=9&&v<=50 },
    { group:'🟡 الكبد',  key:'ast',     label:'AST/SGOT',       unit:'U/L',    goodDir:'down', ok:v=>v>=17&&v<=59 },
  ];

  // Date picker buttons
  const btnStyle = (idx, sel) => `style="background:${idx===sel?'#06b6d4':'#0f172a'};border:1px solid ${idx===sel?'#06b6d4':'#334155'};border-radius:7px;padding:4px 9px;color:${idx===sel?'white':'#94a3b8'};font:inherit;font-size:11px;cursor:pointer;font-weight:${idx===sel?'700':'400'}"`;

  const pickerA = all.map((l,i)=>`<button onclick="labCmpA=${i};RENDERERS.labs()" ${btnStyle(i,labCmpA)}>${l.date.slice(0,7)}</button>`).join('');
  const pickerB = all.map((l,i)=>`<button onclick="labCmpB=${i};RENDERERS.labs()" ${btnStyle(i,labCmpB)}>${l.date.slice(0,7)}</button>`).join('');

  // Build comparison rows grouped
  let lastGroup = null;
  const tableRows = rows.map(r => {
    const vA = r.compute ? r.compute(A) : A[r.key];
    const vB = r.compute ? r.compute(B) : B[r.key];
    if(vA == null && vB == null) return '';

    const fA = vA != null ? (Number.isInteger(vA) ? vA : parseFloat(vA).toFixed(vA >= 10 ? 1 : 2)) : '—';
    const fB = vB != null ? (Number.isInteger(vB) ? vB : parseFloat(vB).toFixed(vB >= 10 ? 1 : 2)) : '—';

    // Status colors for each value
    const colA = vA==null?'#64748b': r.ok(parseFloat(vA))?'#4ade80': r.warn&&r.warn(parseFloat(vA))?'#fbbf24':'#f87171';
    const colB = vB==null?'#64748b': r.ok(parseFloat(vB))?'#4ade80': r.warn&&r.warn(parseFloat(vB))?'#fbbf24':'#f87171';

    // Diff arrow
    let arrow = '', diffVal = '', arrowCol = '#64748b';
    if(vA != null && vB != null){
      const diff = +(parseFloat(vB) - parseFloat(vA)).toFixed(2);
      const absDiff = Math.abs(diff);
      diffVal = (diff > 0 ? '+' : '') + (absDiff >= 10 ? Math.round(diff) : diff.toFixed(2));
      if(Math.abs(diff) < 0.01){ arrow = '→'; arrowCol = '#64748b'; }
      else {
        const improved = r.goodDir === 'down' ? diff < 0 : r.goodDir === 'up' ? diff > 0 : null;
        arrow = diff > 0 ? '↑' : '↓';
        arrowCol = improved === null ? '#94a3b8' : improved ? '#4ade80' : '#f87171';
      }
    }

    const groupHeader = r.group !== lastGroup
      ? `<tr><td colspan="4" style="padding:8px 6px 4px;font-size:10px;font-weight:700;color:#94a3b8;border-bottom:1px solid #334155">${r.group}</td></tr>`
      : '';
    lastGroup = r.group;

    return groupHeader + `<tr style="border-bottom:1px solid #1a2940">
      <td style="padding:6px;font-size:11px;color:#94a3b8">${r.label}<br><span style="font-size:9px;color:#475569">${r.unit}</span></td>
      <td style="padding:6px;text-align:center;font-size:14px;font-weight:900;color:${colA}">${fA}</td>
      <td style="padding:6px;text-align:center;font-size:14px;font-weight:900;color:${colB}">${fB}</td>
      <td style="padding:6px;text-align:center">
        ${arrow ? `<span style="font-size:14px;font-weight:900;color:${arrowCol}">${arrow}</span>` : ''}
        ${diffVal ? `<br><span style="font-size:9px;color:${arrowCol}">${diffVal}</span>` : ''}
      </td>
    </tr>`;
  }).filter(Boolean).join('');

  // Summary: how many improved vs worsened
  let impCount = 0, worCount = 0;
  rows.forEach(r => {
    const vA = r.compute ? r.compute(A) : A[r.key];
    const vB = r.compute ? r.compute(B) : B[r.key];
    if(vA == null || vB == null || r.goodDir === 'neutral') return;
    const diff = parseFloat(vB) - parseFloat(vA);
    if(Math.abs(diff) < 0.01) return;
    const improved = r.goodDir === 'down' ? diff < 0 : diff > 0;
    if(improved) impCount++; else worCount++;
  });

  // Time between sessions
  const dA = A.date, dB = B.date;
  const daysBetween = Math.round(Math.abs(parseDate(dB) - parseDate(dA)) / 86400000);
  const monthsBetween = Math.round(daysBetween / 30);

  return `<div class="card" style="border-color:#0ea5e944">
    <div class="card-title" style="color:#38bdf8"><span class="ct-icon">🔍</span>مقارنة جلستين</div>

    <div style="margin-bottom:10px">
      <div style="font-size:10px;color:#64748b;margin-bottom:5px">الجلسة الأولى (A):</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${pickerA}</div>
    </div>
    <div style="margin-bottom:12px">
      <div style="font-size:10px;color:#64748b;margin-bottom:5px">الجلسة الثانية (B):</div>
      <div style="display:flex;flex-wrap:wrap;gap:5px">${pickerB}</div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <div style="flex:1;background:#0f172a;border-radius:9px;padding:10px;text-align:center">
        <div style="font-size:9px;color:#64748b">A · ${A.hosp||'—'}</div>
        <div style="font-size:13px;font-weight:800;color:#94a3b8">${dA}</div>
      </div>
      <div style="font-size:11px;color:#64748b;flex-shrink:0">${monthsBetween} شهر</div>
      <div style="flex:1;background:#0c2a47;border-radius:9px;padding:10px;text-align:center;border:1px solid #0ea5e944">
        <div style="font-size:9px;color:#06b6d4">B · ${B.hosp||'—'}</div>
        <div style="font-size:13px;font-weight:800;color:#38bdf8">${dB}</div>
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div style="flex:1;background:#052e16;border-radius:8px;padding:8px;text-align:center;border:1px solid #166534">
        <div style="font-size:18px;font-weight:900;color:#4ade80">${impCount}</div>
        <div style="font-size:10px;color:#4ade80">مؤشر تحسّن</div>
      </div>
      <div style="flex:1;background:${worCount>0?'#450a0a':'#0f172a'};border-radius:8px;padding:8px;text-align:center;border:1px solid ${worCount>0?'#991b1b':'#1e293b'}">
        <div style="font-size:18px;font-weight:900;color:${worCount>0?'#f87171':'#64748b'}">${worCount}</div>
        <div style="font-size:10px;color:${worCount>0?'#f87171':'#64748b'}">مؤشر ارتفع</div>
      </div>
      <div style="flex:1;background:#1e293b;border-radius:8px;padding:8px;text-align:center">
        <div style="font-size:18px;font-weight:900;color:#64748b">${rows.filter(r=>{ const va=r.compute?r.compute(A):A[r.key]; const vb=r.compute?r.compute(B):B[r.key]; return va!=null&&vb!=null&&Math.abs(parseFloat(vb)-parseFloat(va))<0.01; }).length}</div>
        <div style="font-size:10px;color:#64748b">لم يتغير</div>
      </div>
    </div>

    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="background:#1e293b">
            <th style="padding:6px;text-align:right;font-size:10px;color:#64748b;border-bottom:1px solid #334155;font-weight:600">المؤشر</th>
            <th style="padding:6px;text-align:center;font-size:10px;color:#94a3b8;border-bottom:1px solid #334155;font-weight:600">A<br><span style="color:#475569">${dA.slice(0,7)}</span></th>
            <th style="padding:6px;text-align:center;font-size:10px;color:#38bdf8;border-bottom:1px solid #334155;font-weight:600">B<br><span style="color:#0ea5e9">${dB.slice(0,7)}</span></th>
            <th style="padding:6px;text-align:center;font-size:10px;color:#64748b;border-bottom:1px solid #334155;font-weight:600">B−A</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    <div style="margin-top:8px;font-size:10px;color:#475569;line-height:1.7;padding:6px 8px;background:#0f172a;border-radius:6px">
      ↑ ارتفاع · ↓ انخفاض · <span style="color:#4ade80">أخضر = تحسن</span> · <span style="color:#f87171">أحمر = تراجع</span> · <span style="color:#64748b">رمادي = محايد</span>
    </div>
  </div>`;
}

function renderDawnCard(){
  const d = analyzeDawnPhenomenon();

  if(!d.pairs.length){
    return `<div class="card" style="border-color:#f59e0b44">
      <div class="card-title" style="color:#fbbf24"><span class="ct-icon">🌅</span>ظاهرة الفجر السكري</div>
      <div style="padding:16px 0;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">🌙</div>
        <div style="font-size:13px;font-weight:800;color:#94a3b8">لا توجد بيانات كافية بعد</div>
        <div class="txt-sm txt-mute" style="margin-top:6px;line-height:1.7">
          سجّل قياس <b style="color:#fbbf24">قبل النوم 🌙</b> وآخر <b style="color:#38bdf8">صائم صباحاً 🌅</b> يومياً<br>
          لتفعيل تحليل ظاهرة الفجر تلقائياً
        </div>
        <button class="btn-main" onclick="MODALS.sugarBedModal()" style="margin-top:12px;background:linear-gradient(135deg,#7c3aed,#a855f7)">
          🌙 تسجيل سكر قبل النوم الآن
        </button>
      </div>
    </div>`;
  }

  const sevMap = {
    none:     {col:'#4ade80', badgeCls:'b-ok',   label:'طبيعي ✓'},
    mild:     {col:'#fbbf24', badgeCls:'b-warn',  label:'خفيف ⚠'},
    moderate: {col:'#f97316', badgeCls:'b-low',   label:'متوسط ⚠⚠'},
    severe:   {col:'#f87171', badgeCls:'b-high',  label:'حرج ⚠⚠⚠'},
  };
  const sev = sevMap[d.severity] || {col:'#94a3b8', badgeCls:'b-info', label:'قيد الرصد'};
  const patternAr = d.pattern==='dawn'?'ظاهرة الفجر':d.pattern==='somogyi'?'سوموجي':'طبيعي';
  const trendAr   = d.trend==='improving'?'📉 تتحسن':d.trend==='worsening'?'📈 تتفاقم':d.trend==='stable'?'📊 مستقرة':'—';
  const borderCol = sev.col + '44';

// ════════════════════════════════════════════════════
//  DAWN PHENOMENON DETECTOR
//  Compares bedtime sugar (marker='bed') with next-morning fasting sugar (marker='fasting')
//  Returns: analysis object with pattern, severity, trend, and advice
// ════════════════════════════════════════════════════
function analyzeDawnPhenomenon() {
  const result = {
    pairs: [],          // [{date, bed, fast, rise, pct}]
    avgRise: null,      // average overnight rise (mg/dl)
    avgBed: null,
    avgFast: null,
    severity: null,     // 'none' | 'mild' | 'moderate' | 'severe'
    pattern: null,      // 'dawn' | 'somogyi' | 'normal'
    trend: null,        // 'improving' | 'worsening' | 'stable'
    triggered: false,   // true if confirmed pattern (≥3 pairs)
    dawnDays: 0,        // days with clear dawn rise
    normalDays: 0,
  };

  // Sort sugar log by date+time ascending
  const sorted = sugarLog.slice().sort((a, b) => {
    const da = parseDate(a.date).getTime() + timeToMinutes(a.time||'00:00')*60000;
    const db = parseDate(b.date).getTime() + timeToMinutes(b.time||'00:00')*60000;
    return da - db;
  });

  // Build pairs: find bed reading then next morning fasting
  const processed = new Set();
  for (let i = 0; i < sorted.length; i++) {
    const bedEntry = sorted[i];
    if (bedEntry.marker !== 'bed') continue;
    const bedDate = parseDate(bedEntry.date);
    const bedKey = bedEntry.date + '_bed';
    if (processed.has(bedKey)) continue;

    // Look for fasting reading on the NEXT day (within 12h after bedtime)
    const nextDay = new Date(bedDate.getTime() + 86400000);
    const nextDayStr = dateToStr(nextDay);
    const fastEntry = sorted.find(x =>
      x.marker === 'fasting' &&
      (x.date === nextDayStr) &&
      !processed.has(x.date + '_fast')
    );

    if (fastEntry) {
      const rise = fastEntry.value - bedEntry.value;
      const pct = Math.round((rise / bedEntry.value) * 100);
      result.pairs.push({
        bedDate: bedEntry.date,
        fastDate: fastEntry.date,
        bed: bedEntry.value,
        fast: fastEntry.value,
        bedTime: bedEntry.time || '—',
        fastTime: fastEntry.time || '—',
        rise,
        pct,
        isDawn: rise > 20 && fastEntry.value > 100,
        isSomogyi: bedEntry.value < 80 && rise > 30,
      });
      processed.add(bedKey);
      processed.add(fastEntry.date + '_fast');
    }
  }

  if (result.pairs.length === 0) return result;

  // Calculate stats
  const rises = result.pairs.map(p => p.rise);
  result.avgRise = Math.round(rises.reduce((a,b)=>a+b,0) / rises.length);
  result.avgBed  = Math.round(result.pairs.reduce((a,p)=>a+p.bed, 0) / result.pairs.length);
  result.avgFast = Math.round(result.pairs.reduce((a,p)=>a+p.fast,0) / result.pairs.length);
  result.dawnDays   = result.pairs.filter(p=>p.isDawn).length;
  result.normalDays = result.pairs.filter(p=>!p.isDawn).length;

  // Need at least 3 pairs for reliable detection
  if (result.pairs.length >= 3) {
    result.triggered = true;

    // Severity based on average rise
    if (result.avgRise <= 10)       result.severity = 'none';
    else if (result.avgRise <= 25)  result.severity = 'mild';
    else if (result.avgRise <= 45)  result.severity = 'moderate';
    else                             result.severity = 'severe';

    // Pattern detection
    const somogyi = result.pairs.filter(p=>p.isSomogyi).length;
    if (somogyi >= result.pairs.length * 0.5) {
      result.pattern = 'somogyi';
    } else if (result.dawnDays >= result.pairs.length * 0.5) {
      result.pattern = 'dawn';
    } else {
      result.pattern = 'normal';
    }

    // Trend: compare first half vs second half of pairs
    if (result.pairs.length >= 6) {
      const half = Math.floor(result.pairs.length / 2);
      const older  = result.pairs.slice(0, half).reduce((a,p)=>a+p.rise,0)/half;
      const recent = result.pairs.slice(half).reduce((a,p)=>a+p.rise,0)/(result.pairs.length-half);
      if (recent < older - 5)      result.trend = 'improving';
      else if (recent > older + 5) result.trend = 'worsening';
      else                          result.trend = 'stable';
    }
  }

  return result;
}

function timeToMinutes(t) {
  if (!t || !t.includes(':')) return 0;
  const [h, m] = t.split(':').map(Number);
  return (h||0)*60 + (m||0);
}

function dateToStr(d) {
  const day   = String(d.getDate()).padStart(2,'0');
  const month = String(d.getMonth()+1).padStart(2,'0');
  return `${day}/${month}/${d.getFullYear()}`;
}

RENDERERS.calendar = function(){
  // Sort by date
  const sortedAppts = [...appointments].sort((a,b) => parseDate(a.date) - parseDate(b.date));
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const upcoming = sortedAppts.filter(a => parseDate(a.date) >= today0);
  const past = sortedAppts.filter(a => parseDate(a.date) < today0).reverse();
  const todayAppts = upcoming.filter(a => parseDate(a.date).getTime() === today0.getTime());
  const tomorrowAppts = upcoming.filter(a => {
    const ad = parseDate(a.date);
    return ad.getTime() === today0.getTime() + 86400000;
  });
  const thisWeek = upcoming.filter(a => {
    const days = (parseDate(a.date) - today0) / 86400000;
    return days > 1 && days <= 7;

        ${todayAppts.map(renderAppt).join('')}
      </div>
    ` : ''}

    ${tomorrowAppts.length > 0 ? `
      <div class="card" style="border-color:#fbbf24">
        <div class="card-title" style="color:#fbbf24"><span class="ct-icon">⏰</span>غداً</div>
        ${tomorrowAppts.map(renderAppt).join('')}

    ` : ''}

    ${thisWeek.length > 0 ? `
      <div class="card">
        <div class="card-title"><span class="ct-icon">📌</span>هذا الأسبوع</div>
        ${thisWeek.map(renderAppt).join('')}

    ${later.length > 0 ? `

      </div>

    ${upcoming.length === 0 ? `
      <div class="card" style="text-align:center;padding:30px 20px">
        <div style="font-size:48px;margin-bottom:10px">📅</div>
        <div style="font-size:14px;font-weight:700;color:#94a3b8">لا توجد مواعيد قادمة</div>

      </div>

    ${past.length > 0 ? `

        <div class="card-title flex-between">
          <span><span class="ct-icon">📋</span>مواعيد سابقة (${past.length})</span>

        ${past.slice(0,8).map(a => renderAppt(a, true)).join('')}

function renderAppt(a, isPast=false){
  const ad = parseDate(a.date);
  const today0 = new Date();
  today0.setHours(0,0,0,0);
  const days = Math.round((ad - today0) / 86400000);
  let dayLabel;
  if(days === 0) dayLabel = '🔔 اليوم';
  else if(days === 1) dayLabel = '⏰ غداً';
  else if(days > 1 && days <= 7) dayLabel = `بعد ${days} أيام`;
  else if(days > 7) dayLabel = `${a.date}`;
  else if(days === -1) dayLabel = 'أمس';
  else dayLabel = a.date;

  const typeIcons = {
    doctor:'👨‍⚕️', lab:'🔬', screening:'🩺', dental:'🦷',
    eye:'👁', specialist:'🏥', other:'📅'
  };
  const icon = typeIcons[a.type] || '📅';
  const opacity = isPast ? '0.65' : '1';

  return `
    <div style="background:#0f172a;border:1px solid #2a3f5f;border-radius:11px;padding:11px 13px;margin-bottom:8px;opacity:${opacity}">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="font-size:22px;flex-shrink:0">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px">
            <div style="font-size:13px;font-weight:800;color:#e2e8f0">${a.title}</div>
            <button class="del-btn" onclick="delItem('appointment',${a.id})">×</button>
          </div>
          <div class="txt-sm" style="color:#94a3b8;display:flex;flex-wrap:wrap;gap:8px">
            <span>📅 ${dayLabel}</span>
            ${a.time ? `<span>⏰ ${a.time}</span>` : ''}
            ${a.location ? `<span>📍 ${a.location}</span>` : ''}
          </div>
          ${a.note ? `<div class="txt-sm" style="color:#cbd5e1;margin-top:5px;background:#0a1628;padding:5px 8px;border-radius:5px">📝 ${a.note}</div>` : ''}
          ${a.recurring ? `<div class="txt-sm" style="color:#a855f7;margin-top:4px">🔄 موعد متكرر · ${a.recurring}</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

// ────────── Add appointment alerts to main alerts engine ──────────
function getAppointmentAlerts(){
  const out = [];
  const today0 = new Date(); today0.setHours(0,0,0,0);
  appointments.forEach(a => {
    const ad = parseDate(a.date);
    const days = (ad - today0) / 86400000;
    if(days === 0){
      out.push({type:'crit',icon:'🔔',msg:`موعد اليوم: ${a.title}${a.time?' الساعة '+a.time:''}`});
    } else if(days === 1){
      out.push({type:'warn',icon:'⏰',msg:`موعد غداً: ${a.title}${a.time?' الساعة '+a.time:''}`});
    }
  });
  return out;
}

      <button class="btn-main" onclick="addAppointment(${existing?existing.id:null})">✅ ${existing?'تحديث':'حفظ'} الموعد</button>
    </div>
  `);
};

function dateStrToISO(d){
  if(!d) return todayISO();
  const [day,m,y] = d.split('/');
  return `${y}-${m}-${day}`;
}

function addAppointment(editId){
  const t = document.getElementById('ap-title').value;
  if(!t) return toast('⚠ أدخل عنوان الموعد');
  const d = document.getElementById('ap-date').value;
  if(!d) return toast('⚠ اختر التاريخ');

  const data = {
    type: document.getElementById('ap-type').value,
    title: t,
    date: isoToDateStr(d),
    time: document.getElementById('ap-time').value || '',
    location: document.getElementById('ap-location').value || '',
    recurring: document.getElementById('ap-recurring').value || '',
    note: document.getElementById('ap-note').value || '',
  };

  if(editId){
    appointments = appointments.map(a => a.id === editId ? {...a, ...data} : a);
  } else {
    appointments.unshift({id:Date.now(), ...data});
    // If recurring, generate next 4 occurrences
    if(data.recurring){
      const intervalDays = {weekly:7, monthly:30, '3months':90, '6months':180, yearly:365}[data.recurring];
      if(intervalDays){
        let nextDate = parseDate(data.date);
        for(let i=1; i<=3; i++){
          nextDate = new Date(nextDate.getTime() + intervalDays * 86400000);
          const nd = `${String(nextDate.getDate()).padStart(2,'0')}/${String(nextDate.getMonth()+1).padStart(2,'0')}/${nextDate.getFullYear()}`;
          appointments.push({id:Date.now()+i, ...data, date: nd});
        }
      }
    }
  }
  SAVE('appointments', appointments);
  window.appointments = appointments;
  closeModal();
  toast(editId?'✅ تم التحديث':'✅ تم حفظ الموعد');
  if(RENDERERS[curTab]) RENDERERS[curTab]();
}

      drawChart('mealSugarChart', msData, {
        min: Math.max(50, Math.min(...msData.map(p=>p.before))-10),
        max: Math.max(...msData.map(p=>p.after))+15,
        refs: [{value:140, color:'#f59e0b', label:'140'},{value:180, color:'#ef4444', label:'180'}],
        series: [
          {key:'before', color:'#06b6d4', width:2, fill:false, dash:[4,3]},
          {key:'after',  color:'#f97316', width:2.5, fill:false,
           dotColorFn:v=>v<=140?'#4ade80':v<=180?'#fbbf24':'#ef4444'},
        ]
      });
    }
  },80);
};

//  PDF LIBRARIES (lazy-loaded on first use)
// ════════════════════════════════════════════════════
const PDF_LIBS = {
  html2canvas: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  jspdf:       'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
};
async function ensurePdfLibs(){
  if(window.html2canvas && window.jspdf) return;
  if(!window.html2canvas) await loadScript(PDF_LIBS.html2canvas);
  if(!window.jspdf) await loadScript(PDF_LIBS.jspdf);
}

let currentPdfBlobUrl = null;

function showPdfPreview(url, filename, blob){

          <b style="color:#06b6d4">💻 Windows/Mac:</b><br>

function closePdfPreview(){
  if(currentPdfBlobUrl){
    setTimeout(()=>{ try { URL.revokeObjectURL(currentPdfBlobUrl); } catch(e){} }, 1000);
  }
  closeModal();
}

function pdfDownload(){
  if(!currentPdfBlobUrl || !currentPdfFilename) return;
  const a = document.createElement('a');
  a.href = currentPdfBlobUrl;
  a.download = currentPdfFilename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>a.remove(), 200);
  toast('✅ تم — افحص "التنزيلات"');
}

function pdfPrint(){
  if(!currentPdfBlobUrl) return;
  // Open the PDF in a new window for printing
  const w = window.open(currentPdfBlobUrl, '_blank');
  if(!w){
    // Popup blocked — navigate current page
    window.location.href = currentPdfBlobUrl;
    return;
  }
  toast('🖨️ اطبع من النافذة التي فُتحت');
}

async function pdfShare(){
  if(!currentPdfBlob || !currentPdfFilename){ return; }
  if(navigator.share && navigator.canShare){
    try {
      const file = new File([currentPdfBlob], currentPdfFilename, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'التقرير الطبي - صحتي'});
        return;
      }
    } catch(e){
      if(e.name !== 'AbortError') console.warn(e);
      return;
    }
  }
  toast('❌ المشاركة غير متاحة — استخدم "تحميل" أو "عرض"');
}

function pdfOpenInTab(){
  if(!currentPdfBlobUrl) return;
  window.open(currentPdfBlobUrl, '_blank');
}

// ════════════════════════════════════════════════════
//  DIRECT PRINT — opens browser print dialog immediately
//  Doesn't generate PDF, uses browser's native print
// ════════════════════════════════════════════════════
function printNow(){
  const html = buildReportHTML();
  if(!html){ toast('⚠ التقرير غير محمّل'); return; }

  // Method 1: try opening in new window with auto-print
  const w = window.open('', '_blank');
  if(w && w.document){
    w.document.open();
    w.document.write(html);
    w.document.close();
    toast('🖨️ افتحت نافذة الطباعة');
    return;
  }

  // Method 2: blob URL fallback (iOS PWA blocks window.open sometimes)
  try {
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const w2 = window.open(url, '_blank');
    if(w2){
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
      toast('🖨️ افتحت نافذة الطباعة');
      return;
    }
    // Method 3: iframe printing inline (last resort)
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position:fixed;width:0;height:0;border:0;left:-9999px;top:-9999px';
    iframe.src = url;
    iframe.onload = ()=>{
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch(e){
        toast('❌ المتصفح يمنع الطباعة — استخدم "PDF" بدلاً منها');
      }
      setTimeout(()=>{ iframe.remove(); URL.revokeObjectURL(url); }, 30000);
    };
    document.body.appendChild(iframe);
    toast('🖨️ جاري فتح الطباعة...');
  } catch(e){
    console.error('Print failed:', e);
    toast('❌ فشلت الطباعة — جرّب زر "PDF"');
  }
}

// ════════════════════════════════════════════════════
//  PRINT / EXPORT REPORT AS REAL PDF
// ════════════════════════════════════════════════════
async function printReport(){
  const btn = event?.target;
  const origText = btn?.innerHTML;

  // Show progress
  if(btn){ btn.innerHTML = '⏳ جاري إنشاء الـ PDF...'; btn.disabled = true; }
  toast('⏳ جاري تحضير الـ PDF — قد يستغرق 10 ثواني');

  try {
    await ensurePdfLibs();

    // Build a clean container with the report content (off-screen)
    const reportPage = document.getElementById('page-report');
    if(!reportPage){ throw new Error('التقرير غير محمّل'); }

    // Clone the report (without action buttons)
    const clone = reportPage.cloneNode(true);
    clone.querySelectorAll('.no-print').forEach(el=>el.remove());

    // Wrap in a fresh white container at proper PDF width
    const wrap = document.createElement('div');
    wrap.style.cssText = `
      position:fixed; top:-99999px; left:-99999px;
      width:794px; padding:30px;
      background:#ffffff; color:#000;
      font-family:'Segoe UI',Tahoma,Arial,sans-serif;
      direction:rtl; line-height:1.5;
    `;
    wrap.innerHTML = clone.innerHTML;

    // Override dark colors for printing
    const allEls = wrap.querySelectorAll('*');
    allEls.forEach(el=>{
      const s = el.style;
      // Don't override report-title (it has its own colors)
      if(!el.closest('.report-title')){
        if(s.color && (s.color.includes('rgb(255') || s.color.includes('#fff') || s.color.includes('#f1f5f9') || s.color.includes('#e2e8f0') || s.color.includes('#cbd5e1') || s.color.includes('#94a3b8'))){
          s.color = '#1a1a1a';
        }
        if(s.background && (s.background.includes('#0a') || s.background.includes('#0f') || s.background.includes('#1a') || s.background.includes('#1e'))){
          s.background = '#f5f5f5';
        }
      }
    });

    document.body.appendChild(wrap);

    // Render to canvas
    const canvas = await window.html2canvas(wrap, {
      scale: 2,           // higher quality
      backgroundColor: '#ffffff',
      logging: false,
      useCORS: true,
      windowWidth: 794,
    });

    document.body.removeChild(wrap);

    // Create PDF (A4 portrait: 210mm × 297mm)
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfWidth = 210;
    const pdfHeight = 297;
    const imgWidth = pdfWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);

    // First page
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pdfHeight;

    // Additional pages if content is long
    while(heightLeft > 0){
      position -= pdfHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pdfHeight;
    }

    // Save the PDF
    const dateSafe = todayISO();
    const filename = `تقرير_${profile.name.replace(/\s/g,'_')}_${dateSafe}.pdf`;
    const pdfBlob = pdf.output('blob');

    // Detect platform
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(navigator.userAgent);

    // ─── STRATEGY 1: Web Share API (best on mobile — shows native share sheet) ───
    if(navigator.share && navigator.canShare){
      try {
        const file = new File([pdfBlob], filename, {type:'application/pdf'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({
            files: [file],
            title: 'التقرير الطبي - صحتي',
          });
          if(btn){ btn.innerHTML = origText; btn.disabled = false; }
          return;
        }
      } catch(shareErr){
        if(shareErr.name === 'AbortError'){
          // User cancelled — no error
          if(btn){ btn.innerHTML = origText; btn.disabled = false; }
          return;
        }
        console.warn('Share failed:', shareErr);
      }
    }

    // ─── STRATEGY 2: Show inline PDF preview with download/print buttons ───
    // This works everywhere, especially in PWA mode where window.open is blocked
    const url = URL.createObjectURL(pdfBlob);
    showPdfPreview(url, filename, pdfBlob);
    if(btn){ btn.innerHTML = origText; btn.disabled = false; }

  } catch(err){
    console.error('PDF generation failed:', err);
    if(btn){ btn.innerHTML = origText; btn.disabled = false; }
    toast('❌ فشل إنشاء PDF — جاري المحاولة بطريقة بديلة...');
    // Fallback: open print-friendly window
    printReportFallback();
  }
}

// Fallback: open clean window with print dialog (older method)
function printReportFallback(){
  const html = buildReportHTML();
  if(!html){ toast('⚠ لم يُحمَّل التقرير بعد'); return; }
  try {
    const w = window.open('', '_blank');
    if(w && w.document){
      w.document.open();
      w.document.write(html);
      w.document.close();
      return;
    }
  } catch(e){}
  try {
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const w2 = window.open(url, '_blank');
    if(!w2){
      const a = document.createElement('a');
      a.href = url; a.download = 'doctor_report.html';
      document.body.appendChild(a); a.click();
      setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 200);
      toast('💡 تم تحميل الملف — افتحه واطبعه يدوياً');
    } else {
      setTimeout(()=>URL.revokeObjectURL(url), 30000);
    }
  } catch(e){
    try { window.print(); }
    catch(e2){ toast('❌ المتصفح لا يدعم الطباعة'); }
  }
}

function downloadReportHTML(){
  const html = buildReportHTML();
  if(!html){ toast('⚠ لم يُحمَّل التقرير بعد'); return; }
  // Remove auto-print script for the downloaded version (built dynamically to avoid HTML parser issues)
  const openTag = '<' + 'script>';
  const closeTag = '</' + 'script>';
  const re = new RegExp(openTag + '[\\s\\S]*?' + closeTag, 'g');
  const cleanHtml = html.replace(re, '');
  const blob = new Blob([cleanHtml], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateSafe = todayISO();
  a.href = url;
  a.download = `تقرير_${profile.name.replace(/\s/g,'_')}_${dateSafe}.html`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 200);
  toast('✅ تم تحميل التقرير');
}

    <div class="report-section" style="background:#fff;color:#000;border-radius:14px;padding:0;overflow:hidden;margin-bottom:12px">

      <div style="padding:14px 18px;background:#fff;color:#000;font-size:12px;line-height:1.8">
        ${(()=>{
          const notes=[];
          if(firstLab&&lastLab&&firstLab!==lastLab){
            const delta=lastLab.hba1c-firstLab.hba1c;
            notes.push(`• تغير HbA1c من ${firstLab.hba1c}% إلى ${lastLab.hba1c}% (${delta>=0?'+':''}${delta.toFixed(1)} نقطة) خلال الفترة بين ${firstLab.date} و ${lastLab.date}`);
          }
          if(fastAvg&&fastAvg>130) notes.push(`• متوسط سكر الصائم مرتفع (${fastAvg}) — يحتاج مراجعة جرعة الدواء أو الخطة الغذائية`);
          if(lb&&(lb.sys>=140||lb.dia>=90)) notes.push(`• ضغط الدم مرتفع في آخر قياس (${lb.sys}/${lb.dia})`);
          if(sympRecent.filter(x=>x.severity==='شديد').length) notes.push(`• ظهرت أعراض شديدة ${sympRecent.filter(x=>x.severity==='شديد').length} مرة خلال الشهر`);
          if(notes.length===0) notes.push('• لا توجد ملاحظات حرجة');
          return notes.join('<br>');
        })()}
      </div>
    </div>

    <div style="text-align:center;font-size:10px;color:#64748b;margin-top:20px;padding:10px">
      تم إنشاء التقرير بواسطة تطبيق صحتي · ${today}
    </div>
  `;
};

function addFootExam(){
  const d = document.getElementById('fe-date').value;
  const findings = [];
  const checks = {
    'fe-cuts':'جروح/تشققات', 'fe-blisters':'فقاعات', 'fe-redness':'احمرار/انتفاخ',
    'fe-color':'تغير لون الجلد', 'fe-nail':'تشوه أظافر', 'fe-corns':'مسامير',
    'fe-numb':'تنميل/فقد إحساس', 'fe-cold':'برودة', 'fe-pain':'ألم بالراحة',
    'fe-pulse':'ضعف نبض'
  };
  Object.entries(checks).forEach(([id,n]) => {
    if(document.getElementById(id)?.checked) findings.push(n);
  });

  let result, severity = 'ok';
  if(findings.length === 0){
    result = 'طبيعي ✓ — لا توجد علامات تحذيرية';
  } else if(findings.length <= 2){
    result = `يحتاج متابعة — وُجد: ${findings.join('، ')}`;
    severity = 'warn';
  } else {
    result = `⚠ يحتاج طبيباً عاجلاً — وُجد: ${findings.join('، ')}`;
    severity = 'crit';
  }

  // Save as both screening + detailed foot exam
  screeningLog.unshift({
    id: Date.now(), type:'foot',
    date: isoToDateStr(d),
    result, findings, severity,
    note: document.getElementById('fe-note').value || '',
  });
  SAVE('screening_log', screeningLog);
  window.screeningLog = screeningLog;
  closeModal();
  if(severity === 'crit'){
    toast('⚠ نتائج تحتاج طبيباً — راجع الطبيب قريباً');
  } else if(severity === 'warn'){
    toast('⚠ يحتاج متابعة');
  } else {
    toast('✅ القدمان في حالة جيدة');
  }
  if(curTab === 'screenings') RENDERERS.screenings();
}

MODALS.correctionCalc = function(){
  showModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title">💉 حساب جرعة إنسولين تصحيحية</div>

    </div>

        <input class="inp inp-xl" type="number" id="cc-bg" placeholder="200" oninput="ccCalc()" value="${sugarLog[0]?.value || ''}">
      </div>
      <div><label class="lbl">السكر المستهدف (mg/dL)</label>
        <input class="inp inp-xl" type="number" id="cc-target" placeholder="120" oninput="ccCalc()" value="120">
      </div>
      <div><label class="lbl">معامل الحساسية (ISF)</label>
        <input class="inp inp-xl" type="number" id="cc-isf" placeholder="50" oninput="ccCalc()" value="50">
        <div class="txt-sm txt-mute" style="margin-top:4px">كم نقطة يخفض كل وحدة إنسولين سريع. القيمة الشائعة: 30-60</div>
      </div>
      <div style="background:#0f172a;border-radius:11px;padding:14px;text-align:center;border:1px solid #334155" id="cc-result">
        <div style="font-size:11px;color:#64748b">الجرعة التصحيحية</div>
        <div style="font-size:34px;font-weight:900;color:#475569" id="cc-value">—</div>
        <div style="font-size:12px;color:#64748b" id="cc-label">أدخل القيم للحساب</div>
      </div>
      <div style="background:#7f1d1d22;border:1px solid #dc262644;border-radius:10px;padding:11px;color:#fca5a5;font-size:11px;line-height:1.7">
        ⚠️ <b>تحذير طبي:</b> هذه الحاسبة استرشادية فقط. ISF يحدّده الطبيب لكل مريض. لا تستخدم الجرعة دون إشراف طبي.
      </div>
    </div>
  `);
};
function ccCalc(){
  const bg = +document.getElementById('cc-bg').value;
  const target = +document.getElementById('cc-target').value;
  const isf = +document.getElementById('cc-isf').value;
  const v = document.getElementById('cc-value');
  const l = document.getElementById('cc-label');
  const r = document.getElementById('cc-result');
  if(!bg || !target || !isf){
    v.textContent = '—'; v.style.color = '#475569';
    l.textContent = 'أدخل القيم'; r.style.borderColor = '#334155'; return;
  }
  if(bg <= target){
    v.textContent = '0'; v.style.color = '#4ade80';
    l.textContent = 'السكر في الهدف ✓'; r.style.borderColor = '#4ade80'; return;
  }
  const dose = Math.round((bg - target) / isf * 10) / 10;
  v.textContent = dose;
  v.style.color = '#06b6d4';
  l.textContent = `وحدة إنسولين سريع لخفض ${bg-target} نقطة`;
  r.style.borderColor = '#06b6d4';
}

function pickGender(el){
  document.querySelectorAll('#eg-gender .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  egCalc();
}
function egCalc(){
  const cr = +document.getElementById('eg-cr')?.value;
  const age = +document.getElementById('eg-age')?.value;
  const gender = document.querySelector('#eg-gender .chip.on')?.dataset.g || 'male';
  const v = document.getElementById('eg-value');
  const l = document.getElementById('eg-label');
  const r = document.getElementById('eg-result');
  const a = document.getElementById('eg-advice');
  if(!cr || !age){
    v.textContent='—'; v.style.color='#475569';
    l.textContent='أدخل القيم'; r.style.borderColor='#334155';
    a.innerHTML=''; return;
  }
  const egfr = calcEGFR(cr, age, gender);
  if(!egfr){ a.innerHTML='<div class="txt-sm" style="color:#f87171">خطأ في الحساب</div>'; return; }
  const stage = eGFRStage(egfr);
  v.textContent = egfr;
  v.style.color = stage.col;
  l.textContent = stage.label;
  l.style.color = stage.col;
  r.style.borderColor = stage.col;
  a.innerHTML = `<div style="background:${stage.col}22;border:1px solid ${stage.col}44;border-radius:10px;padding:10px 13px">
    <div class="txt-sm" style="color:#cbd5e1;line-height:1.7">💡 ${stage.advice}</div>
  </div>`;
}

function bcCalc(){
  const w = +document.getElementById('bc-w')?.value;
  const h = +document.getElementById('bc-h')?.value;
  const v = document.getElementById('bc-value');
  const l = document.getElementById('bc-label');
  const r = document.getElementById('bc-result');
  const a = document.getElementById('bc-advice');
  if(!w || !h){
    v.textContent = '—'; v.style.color='#475569';
    l.textContent = 'أدخل الوزن والطول'; l.style.color='#64748b';
    r.style.borderColor='#334155'; a.innerHTML=''; return;
  }
  const b = w / ((h/100)*(h/100));
  v.textContent = b.toFixed(1);
  const s = bmiStat(b);
  v.style.color = s.col;
  l.textContent = s.label; l.style.color = s.col;
  r.style.borderColor = s.col;
  // Ideal weight range for this height
  const minW = (18.5 * (h/100)**2).toFixed(0);
  const maxW = (24.9 * (h/100)**2).toFixed(0);
  const diff = b<25 ? null : Math.round(w - 24.9 * (h/100)**2);
  a.innerHTML = `<div style="background:${s.col}22;border:1px solid ${s.col}44;border-radius:10px;padding:10px 13px">
    <div class="txt-sm" style="color:#cbd5e1;line-height:1.7">
      💡 الوزن المثالي لطولك: <b style="color:${s.col}">${minW} - ${maxW} كجم</b>
      ${diff && diff>0 ? `<br>تحتاج لخسارة <b style="color:#f87171">${diff} كجم</b> للوصول للمعدل الطبيعي` : ''}
    </div>
  </div>`;
}
