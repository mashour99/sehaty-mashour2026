function hcCalc(){
  const fbs = +document.getElementById('hc-fbs').value;
  const ins = +document.getElementById('hc-ins').value;
  const v = document.getElementById('hc-value');
  const l = document.getElementById('hc-label');
  const r = document.getElementById('hc-result');
  const a = document.getElementById('hc-advice');
  if(!fbs || !ins){
    v.textContent = '—'; v.style.color='#475569';
    l.textContent = 'أدخل القيم للحساب'; l.style.color='#64748b';
    r.style.borderColor='#334155'; a.innerHTML=''; return;
  }
  const homair = (fbs * ins) / 405;
  v.textContent = homair.toFixed(2);
  let label, col, bg, advice;
  if(homair < 1.0){ label='✓ حساسية إنسولين ممتازة'; col='#4ade80'; bg='#052e16';
    advice='جسمك يستجيب جيداً للإنسولين — حالة مثالية. استمر على نمط حياتك الصحي.';
  } else if(homair < 1.9){ label='✓ طبيعي'; col='#10b981'; bg='#052e1644';
    advice='حساسية الإنسولين ضمن المعدل الطبيعي.';
  } else if(homair < 2.9){ label='⚠ بداية مقاومة إنسولين'; col='#fbbf24'; bg='#422006';
    advice='يُنصح بـ: تقليل النشويات والسكريات، زيادة النشاط البدني 150 دقيقة/أسبوع، فقدان 5-10% من الوزن، النوم الكافي.';
  } else if(homair < 5){ label='↑ مقاومة إنسولين واضحة'; col='#f87171'; bg='#450a0a';
    advice='قد يشير لما قبل السكري أو سكري نوع 2. راجع الطبيب لمراجعة الخطة العلاجية.';
  } else { label='‼ مقاومة إنسولين شديدة'; col='#fca5a5'; bg='#7f1d1d';
    advice='مؤشر خطير — يستدعي تدخل طبي عاجل ومتابعة دقيقة.';
  }
  v.style.color = col;
  l.textContent = label; l.style.color = col;
  r.style.borderColor = col;

function calcHomaIR(){
  const fbs = +document.getElementById('lb-fbs')?.value;
  const ins = +document.getElementById('lb-insulin')?.value;
  const out = document.getElementById('lb-homair');
  const result = document.getElementById('homaResult');
  if(!fbs || !ins){ out.value=''; result.innerHTML=''; return; }
  const homair = (fbs * ins) / 405;
  out.value = homair.toFixed(2);
  // Interpret
  let label, col, bg, advice;
  if(homair < 1.0){
    label = '✓ حساسية إنسولين ممتازة'; col='#4ade80'; bg='#052e16';
    advice='جسمك يستجيب جيداً للإنسولين — حالة مثالية';
  } else if(homair < 1.9){
    label = '✓ طبيعي'; col='#10b981'; bg='#052e1666';
    advice='حساسية الإنسولين ضمن المعدل الطبيعي';
  } else if(homair < 2.9){
    label = '⚠ بداية مقاومة إنسولين'; col='#fbbf24'; bg='#422006';
    advice='يُنصح بـ: تقليل النشويات، زيادة النشاط البدني، فقدان الوزن';
  } else if(homair < 5){
    label = '↑ مقاومة إنسولين واضحة'; col='#f87171'; bg='#450a0a';
    advice='قد يشير لما قبل السكري أو سكري نوع 2 — راجع الطبيب';
  } else {
    label = '‼ مقاومة إنسولين شديدة'; col='#fca5a5'; bg='#7f1d1d';
    advice='مؤشر خطير — يستدعي تدخل طبي عاجل';
  }
  result.innerHTML = `
    <div style="background:${bg};border:1px solid ${col}44;border-radius:9px;padding:9px 12px">

      <div style="font-size:11px;color:#cbd5e1;margin-top:4px;line-height:1.6">💡 ${advice}</div>
    </div>
  `;
}

// Load PDF.js and SheetJS dynamically on first use (cached after)
const IMPORT_LIBS = {
  pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  xlsx:  'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
};

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)) return res();
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('فشل تحميل: '+src));
    document.head.appendChild(s);
  });
}
async function ensurePdfJs(){
  if(window.pdfjsLib) return;
  await loadScript(IMPORT_LIBS.pdfjs);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = IMPORT_LIBS.pdfjsWorker;
}
async function ensureXlsx(){
  if(window.XLSX) return;
  await loadScript(IMPORT_LIBS.xlsx);
}

// Convert Arabic-Indic digits to regular and normalize
function normNum(s){
  if(s==null) return null;
  s = String(s).trim();
  s = s.replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  s = s.replace(/[،,]/g,'.').replace(/[^\d.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function normText(s){
  if(s==null) return '';
  return String(s).replace(/[\u200E\u200F\u202A-\u202E]/g,'').trim();
}
// Parse various date formats → DD/MM/YYYY
function parseAnyDate(s){
  if(!s) return null;
  s = String(s).trim();
  // ISO YYYY-MM-DD or YYYY.MM.DD
  let m = s.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(m) return `${m[3].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[1]}`;
  // DD/MM/YYYY, DD-MM-YYYY, or DD.MM.YYYY (InBody format)
  m = s.match(/(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if(m){
    let y=m[3]; if(y.length===2) y='20'+y;
    return `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${y}`;
  }
  // Excel serial number
  const n = parseFloat(s);
  if(!isNaN(n) && n>1000 && n<60000){
    const date = new Date((n - 25569) * 86400 * 1000);
    if(!isNaN(date)) {
      return `${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
    }
  }
  return null;
}

// ════════════════════════════════════════════════════════════════
//  PDF TEXT EXTRACTION
// ════════════════════════════════════════════════════════════════
async function extractPdfText(file){
  await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let fullText = '';
  const pages = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({
      str: it.str,
      x: it.transform[4],
      y: it.transform[5],
    }));
    // Sort by y desc, then x asc (RTL doesn't change y order)
    items.sort((a,b)=>{
      if(Math.abs(a.y-b.y)>3) return b.y-a.y;
      return a.x-b.x;
    });
    // Group into lines
    const lines=[]; let cur=[]; let lastY=null;
    items.forEach(it=>{
      if(lastY===null || Math.abs(it.y-lastY)<3){
        cur.push(it.str);
      } else {
        lines.push(cur.join(' '));
        cur=[it.str];
      }
      lastY=it.y;
    });
    if(cur.length) lines.push(cur.join(' '));
    pages.push(lines.join('\n'));
    fullText += lines.join('\n') + '\n';
  }
  return {text:fullText, pages};
}

//  LAB REPORT PARSER (Arabic + English)
// ════════════════════════════════════════════════════════════════
const LAB_PATTERNS = {
  hba1c: [/HbA1c[^\d]*([\d.]+)/i, /Hb\s*A1[Cc][^\d]*([\d.]+)/i, /Glycosylated[^\d]+([\d.]+)/i, /السكر\s*التراكمي[^\d]*([\d.]+)/, /الهيموجلوبين\s*السكري[^\d]*([\d.]+)/, /GLYCO[\s\-]*HB[^\d]*([\d.]+)/i],
  fbs:   [/Serum\s*FBS[^\d]*([\d.]+)/i, /FBS[^\d]*([\d.]+)/i, /Fasting\s*(?:Blood\s*)?Sugar[^\d]*([\d.]+)/i, /GLUCOSE[,\s]*SERUM[\s\(]*FASTING[\)\s]*([\d.]+)/i, /سكر\s*صائم[^\d]*([\d.]+)/, /Glucose[,\s]*Fasting[^\d]*([\d.]+)/i],
  chol:  [/(?:Serum\s*|TOTAL\s*)?CHOLESTEROL[^\d]*([\d.]+)/i, /كوليسترول\s*كل[ىي]?[^\d]*([\d.]+)/, /Total\s*Cholesterol[^\d]*([\d.]+)/i],
  ldl:   [/(?:Serum\s*|LDL[\-\s]*)?CHOLESTEROL?[^\d]*\b(\d+\.?\d*)\b/i, /LDL[^\d]*([\d.]+)/i, /LDL[\s\-]CHOLESTEROL[^\d]*([\d.]+)/i],
  hdl:   [/(?:Serum\s*)?HDL[^\d]*([\d.]+)/i, /HDL[\s\-]CHOLESTEROL[^\d]*([\d.]+)/i],
  tg:    [/(?:Serum\s*)?TRIGLYCERIDES?[^\d]*([\d.]+)/i, /دهون\s*ثلاثي[ةه][^\d]*([\d.]+)/, /TRIG[^\d]*([\d.]+)/i],
  cr:    [/(?:Serum\s*)?CREATININE[^\d]*([\d.]+)/i, /كرياتينين[^\d]*([\d.]+)/, /SERUM\s*CREATININE[^\d]*([\d.]+)/i],
  alt:   [/SGPT[\s\(]*\(?ALT\)?[^\d]*([\d.]+)/i, /ALT[\s\(]*\(?SGPT\)?[^\d]*([\d.]+)/i, /ALT[^\d]*([\d.]+)/i],
  ast:   [/SGOT[\s\(]*\(?AST\)?[^\d]*([\d.]+)/i, /AST[\s\(]*\(?SGOT\)?[^\d]*([\d.]+)/i, /AST[^\d]*([\d.]+)/i],
};
const DATE_PATTERNS = [
  /Collection\s*[Dd]ate[^\d]*([\d]{1,4}[-/][\d]{1,2}[-/][\d]{1,4})/,
  /Date[^\d]*([\d]{1,4}[-/][\d]{1,2}[-/][\d]{1,4})/,
  /تاريخ\s*[^\d]*([\d]{1,4}[-/][\d]{1,2}[-/][\d]{1,4})/,
];
const HOSPITAL_PATTERNS = [
  {re:/GAMA\s*HOSPITAL/i, name:'جاما'},
  {re:/جاما/, name:'جاما'},
  {re:/MOUWASAT/i, name:'المواساة'},
  {re:/المواساة/, name:'المواساة'},
  {re:/SAUDI\s*GERMAN/i, name:'الألماني السعودي'},
  {re:/الألماني/, name:'الألماني السعودي'},
  {re:/Aramco|أرامكو/i, name:'مستشفى أرامكو'},
];

function parseLabReport(text){
  const out = {hba1c:null,fbs:null,chol:null,ldl:null,hdl:null,tg:null,cr:null,alt:null,ast:null,date:null,hosp:'—',raw:text.slice(0,400)};
  // Try patterns
  for(const [k,pats] of Object.entries(LAB_PATTERNS)){
    for(const pat of pats){
      const m = text.match(pat);
      if(m){
        const v = normNum(m[1]);
        if(v!=null) { out[k]=v; break; }
      }
    }
  }
  // Date
  for(const pat of DATE_PATTERNS){
    const m = text.match(pat);
    if(m){ const d=parseAnyDate(m[1]); if(d){out.date=d; break;} }
  }
  if(!out.date) out.date = todayStr();
  // Hospital
  for(const {re,name} of HOSPITAL_PATTERNS){
    if(re.test(text)){ out.hosp=name; break; }
  }
  // Validation: filter implausible values
  if(out.hba1c && (out.hba1c<3 || out.hba1c>20)) out.hba1c=null;
  if(out.fbs   && (out.fbs<30  || out.fbs>700))  out.fbs=null;
  if(out.chol  && (out.chol<50 || out.chol>600)) out.chol=null;
  if(out.ldl   && (out.ldl<10  || out.ldl>400))  out.ldl=null;
  if(out.hdl   && (out.hdl<10  || out.hdl>150))  out.hdl=null;
  if(out.tg    && (out.tg<10   || out.tg>1500))  out.tg=null;
  if(out.cr    && (out.cr<0.1  || out.cr>15))    out.cr=null;
  return out;
}

// ════════════════════════════════════════════════════════════════
//  INBODY PDF PARSER
// ════════════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════════════
//  INBODY PARSER — Tuned for actual InBody PDF layout
// ════════════════════════════════════════════════════════════════
// InBody PDFs have a complex layout where labels and values are in
// separate columns. Generic "Label + number" patterns pick up wrong
// values (e.g., "Target Weight 68.2" instead of actual Weight 91.1).
// We use anchored patterns based on the scale numbers and ranges
// that consistently appear in InBody output.

function parseInBodyReport(text){
  const out = {weight:null,fatPct:null,muscleMass:null,visceralFat:null,water:null,bmi:null,bmr:null,date:null,fatMass:null};

  // ── 1. Date — InBody uses DD.MM.YYYY. HH:MM format ──
  let m = text.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})\.?\s*\d{1,2}:\d{2}/);
  if(m){
    out.date = `${m[1].padStart(2,'0')}/${m[2].padStart(2,'0')}/${m[3]}`;
  }
  if(!out.date){
    for(const pat of DATE_PATTERNS){
      const dm = text.match(pat);
      if(dm){ const d=parseAnyDate(dm[1]); if(d){out.date=d; break;} }
    }
  }
  if(!out.date) out.date = todayStr();

  // ── 2. Total Body Water — pattern "(L) X.X" ──
  m = text.match(/\(L\)\s*([\d.]+)/);
  if(m){
    const v = parseFloat(m[1]);
    if(v>=10 && v<=80) out.water = v;
  }

  // ── 3. Body Fat Mass — "(kg) X.X" before range like "7.8~15.6" ──
  m = text.match(/\(kg\)\s*([\d.]+)\s*\(\s*\)\s*[1-9]\d?\.[\d]+~/);
  // Try to identify Body Fat Mass by its smaller range (7-30)
  const bfmMatches = [...text.matchAll(/\(kg\)\s*([\d.]+)\s*\(\s*\)\s*([\d.]+)~([\d.]+)/g)];
  for(const match of bfmMatches){
    const val = parseFloat(match[1]);
    const rangeMin = parseFloat(match[2]);
    const rangeMax = parseFloat(match[3]);
    // Body Fat Mass: normal range starts ~5-20kg
    if(rangeMin>=5 && rangeMin<=20 && rangeMax<=30 && val>=2 && val<=100){
      out.fatMass = val;
    }
    // Weight: normal range starts at ~40-80kg
    if(rangeMin>=40 && rangeMin<=80 && rangeMax<=120 && val>=30 && val<=250){
      out.weight = val;
    }
  }

  // ── 4. Weight — fallback: look after scale "205 %" ──
  if(!out.weight){
    m = text.match(/205\s*%\s*([\d.]+)/);
    if(m){
      const v = parseFloat(m[1]);
      if(v>=30 && v<=250) out.weight = v;
    }
  }

  // ── 5. SMM (Skeletal Muscle Mass) — after scale "170 %" ──
  m = text.match(/170\s*%\s*([\d.]+)/);
  if(m){
    const v = parseFloat(m[1]);
    if(v>=5 && v<=100) out.muscleMass = v;
  }

  // ── 6. BMI — value 10-60 after "55.0" (end of BMI scale) ──
  // Scale is 10.0 15.0 18.5 22.0 25.0 30.0 35.0 40.0 45.0 50.0 55.0 [BMI]
  m = text.match(/55\.0\s+([\d.]+)(?:\s|$)/);
  if(m){
    const v = parseFloat(m[1]);
    if(v>=10 && v<=60) out.bmi = v;
  }

  // ── 7. PBF (Percent Body Fat) — distinguish from BMI scale ──
  // BMI scale ends "...45.0 50.0 55.0 [BMI]"
  // PBF scale ends "...45.0 50.0 [PBF]" — no 55.0 after
  m = text.match(/45\.0\s+50\.0\s+(?!55\.0)([\d.]+)/);
  if(m){
    const v = parseFloat(m[1]);
    if(v>=3 && v<=70 && v!==out.bmi) out.fatPct = v;
  }

  // ── 8. Visceral Fat Level — appears as "Level XX" after Waist-Hip Ratio ──
  // Format: "Visceral Fat Level Level 14 Low 10 High"
  m = text.match(/Visceral\s+Fat\s+Level[\s\S]{0,80}?Level\s*(\d{1,2})/i);
  if(!m) m = text.match(/Level\s+(\d{1,2})\s+Low\s+\d+\s+High/i);
  if(!m){
    // Try: pattern after waist-hip ratio "0.92 14"
    m = text.match(/0\.\d{2}\s+(\d{1,2})\s+58/);  // 58 = Fat Free Mass nearby
  }
  if(m){
    const v = parseFloat(m[1]);
    if(v>=1 && v<=30) out.visceralFat = v;
  }

  // ── 9. BMR — "1622 kcal" followed by range like "1875~2210" ──
  m = text.match(/(\d{3,4})\s*kcal\s+\d{3,4}~\d{3,4}/);
  if(!m) m = text.match(/Basal\s*Metabolic\s*Rate[^\d]*(\d{3,4})/i);
  if(m){
    const v = parseFloat(m[1]);
    if(v>=600 && v<=4000) out.bmr = v;
  }

  // ── 10. Fallback: use Body Composition History (bottom of report) ──
  // Pattern: "89.3 87.3 88.4 91.1" → last is most recent weight
  if(!out.weight){
    // Look for 4 weight values in sequence (history)
    const histMatch = text.match(/(\d{2,3}\.\d)\s+(\d{2,3}\.\d)\s+(\d{2,3}\.\d)\s+(\d{2,3}\.\d)/);
    if(histMatch){
      const last = parseFloat(histMatch[4]);
      if(last>=30 && last<=250) out.weight = last;
    }
  }

  // Final validation
  if(out.weight && (out.weight<20||out.weight>300)) out.weight=null;
  if(out.fatPct && (out.fatPct<2||out.fatPct>70)) out.fatPct=null;
  if(out.muscleMass && (out.muscleMass<5||out.muscleMass>100)) out.muscleMass=null;
  if(out.visceralFat && (out.visceralFat<1||out.visceralFat>30)) out.visceralFat=null;
  if(out.bmi && (out.bmi<10||out.bmi>60)) out.bmi=null;
  if(out.water && (out.water<15||out.water>80)) out.water=null;
  if(out.bmr && (out.bmr<600||out.bmr>4000)) out.bmr=null;

  return out;
}

// ════════════════════════════════════════════════════════════════
//  AUTO-DETECT REPORT TYPE
// ════════════════════════════════════════════════════════════════
function detectReportType(text){
  const t = text.toLowerCase();
  const inbodyKeys = ['inbody','skeletal muscle','visceral fat','body fat percentage','pbf','smm','tbw'];
  const labKeys    = ['hba1c','glycosylated','cholesterol','triglycerides','creatinine','fbs','fasting'];
  const presKeys   = ['prescription','medication','sitagliptin','metformin','dosage','وصفة','جرعة'];
  const inS = inbodyKeys.filter(k=>t.includes(k)).length;
  const lbS = labKeys.filter(k=>t.includes(k)).length;
  const prS = presKeys.filter(k=>t.includes(k)).length;
  if(inS>=2 && inS>=lbS) return 'inbody';
  if(lbS>=2)             return 'lab';
  if(prS>=1)             return 'prescription';
  return 'unknown';
}

// ════════════════════════════════════════════════════════════════
//  EXCEL/CSV PARSER
// ════════════════════════════════════════════════════════════════
const EXCEL_HEADERS = {
  date:   ['date','تاريخ','التاريخ','يوم','date_time'],
  time:   ['time','وقت','الوقت'],
  sugar:  ['sugar','glucose','bs','blood sugar','سكر','glucose level','reading','قراءة'],
  marker: ['marker','type','نوع','حالة','timing'],
  sys:    ['sys','systolic','الأعلى','انقباضي','sbp'],
  dia:    ['dia','diastolic','الأدنى','انبساطي','dbp'],
  pulse:  ['pulse','heart rate','نبض','heart_rate'],
  weight: ['weight','وزن','الوزن','kg'],
  cals:   ['calories','cals','kcal','سعرات','سعر','حراري'],
  hba1c:  ['hba1c','a1c','glycated','تراكمي'],
  fbs:    ['fbs','fasting','صائم'],
  chol:   ['cholesterol','chol','كوليسترول'],
  ldl:    ['ldl'],
  hdl:    ['hdl'],
  tg:     ['triglycerides','tg','ثلاثي'],
  cr:     ['creatinine','cr','كرياتينين'],
  note:   ['note','notes','ملاحظات','ملاحظة','comment'],
};
function mapHeader(h){
  const norm = String(h||'').toLowerCase().trim();
  for(const [key,aliases] of Object.entries(EXCEL_HEADERS)){
    if(aliases.some(a=>norm===a || norm.includes(a))) return key;
  }
  return null;
}

async function parseExcelFile(file){
  await ensureXlsx();
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, {type:'array'});
  const sheets = {};
  wb.SheetNames.forEach(name=>{
    const ws = wb.Sheets[name];
    const rows = window.XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:false});
    if(!rows.length) return;
    // First non-empty row = headers
    let hdrIdx=0;
    while(hdrIdx<rows.length && rows[hdrIdx].every(c=>!String(c).trim())) hdrIdx++;
    const headers = rows[hdrIdx];
    const mapping = headers.map(mapHeader);
    const data = [];
    for(let i=hdrIdx+1; i<rows.length; i++){
      const row = rows[i];
      if(row.every(c=>!String(c).trim())) continue;
      const obj = {};
      mapping.forEach((k,j)=>{
        if(k && row[j]!=null && row[j]!=='') obj[k]=row[j];
      });
      if(Object.keys(obj).length) data.push(obj);
    }
    sheets[name] = {headers, mapping, data};
  });
  return sheets;
}

// Categorize Excel rows into logs
function categorizeExcelRows(sheets){
  const out = {sugar:[], bp:[], weight:[], meals:[], labs:[]};
  for(const {data} of Object.values(sheets)){
    data.forEach(row=>{
      const date = row.date ? parseAnyDate(row.date) : null;
      const time = row.time ? normText(row.time) : nowTime();
      const note = row.note ? normText(row.note) : '';
      // Sugar
      if(row.sugar!=null){
        const v = normNum(row.sugar);
        if(v) out.sugar.push({value:v, marker: mapMarker(row.marker)||'fasting', date:date||todayStr(), time, note});
      }
      // BP
      if(row.sys!=null && row.dia!=null){
        out.bp.push({sys:normNum(row.sys), dia:normNum(row.dia), pulse:normNum(row.pulse), date:date||todayStr(), time, note});
      }
      // Weight
      if(row.weight!=null && row.sys==null){
        const w = normNum(row.weight);
        if(w) out.weight.push({weight:w, date:date||todayStr(), note});
      }
      // Calories/meals
      if(row.cals!=null){
        const c = normNum(row.cals);
        if(c) out.meals.push({type:'وجبة',foods:note||'استيراد', cals:c, date:date||todayStr(), time});
      }
      // Lab values
      if(row.hba1c!=null || row.fbs!=null || row.chol!=null){
        out.labs.push({
          date: date || todayStr(),
          hba1c: normNum(row.hba1c), fbs: normNum(row.fbs),
          chol: normNum(row.chol), ldl: normNum(row.ldl), hdl: normNum(row.hdl),
          tg: normNum(row.tg), cr: normNum(row.cr),
          hosp: '—', note,
        });
      }
    });
  }
  return out;
}
function mapMarker(s){
  if(!s) return null;
  s=String(s).toLowerCase();
  if(/صائم|fasting|fast/.test(s)) return 'fasting';
  if(/قبل|before/.test(s))         return 'before';
  if(/2h|ساعتين|2\s*hour/.test(s)) return '2h';
  if(/1h|ساعة|1\s*hour/.test(s))   return '1h';
  if(/نوم|bed|sleep/.test(s))       return 'bed';
  if(/random|عشوائ/.test(s))        return 'random';
  return null;
}

function pickImportType(el){
  document.querySelectorAll('#importTypeChips .chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const hints = {
    auto:   '💡 سيكتشف التطبيق نوع الملف من محتواه. يعمل جيداً مع التقارير الواضحة.',
    lab:    '🔬 سيُعامل الملف كتقرير تحاليل مخبرية (HbA1c, كوليسترول, إلخ). PDF فقط.',
    inbody: '⚖️ سيُعامل الملف كتقرير InBody (وزن، دهون، عضلات). PDF فقط.',
    excel:  '📊 ملف جدول بيانات يحتوي قراءات يومية. Excel أو CSV.'
  };
  document.getElementById('importHint').innerHTML = hints[el.dataset.imp];
  // Update file accept
  const accept = el.dataset.imp === 'excel' ? '.xlsx,.xls,.csv' :
                 (el.dataset.imp === 'lab' || el.dataset.imp === 'inbody') ? '.pdf' :
                 '.pdf,.xlsx,.xls,.csv';
  document.getElementById('importFile').accept = accept;
}

async function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = ''; // reset for re-upload
  await processFile(file);
}

async function processFile(file){
  if(!canEdit()) return toast('⚠ ليس لديك صلاحية الاستيراد');

  const ext = file.name.split('.').pop().toLowerCase();
  const sizeMB = file.size/1024/1024;
  if(sizeMB > 20) return toast('⚠ حجم الملف كبير (الحد 20 ميجا)');

  const importEntry = {
    id: Date.now(),
    fileName: file.name,
    fileType: ext.toUpperCase(),
    fileSize: file.size,
    uploadDate: todayStr()+' '+nowTime(),
    status: 'processing',
    summary: '',
    error: null,
  };

  const statusDiv = document.getElementById('importStatus');
  statusDiv.innerHTML = `<div class="alert alert-info"><span style="font-size:16px">⏳</span><span>جاري قراءة الملف <b>${file.name}</b>...</span></div>`;

  try {
    // Get user's chosen type
    const userType = document.querySelector('#importTypeChips .chip.on')?.dataset.imp || 'auto';

    if(ext==='pdf'){
      const {text} = await extractPdfText(file);
      // Auto-detect or use user choice
      let type;
      if(userType === 'auto') type = detectReportType(text);
      else if(userType === 'lab') type = 'lab';
      else if(userType === 'inbody') type = 'inbody';
      else type = detectReportType(text);  // fallback

      let parsed, summary, dataType;
      if(type==='inbody'){
        parsed = parseInBodyReport(text);
        dataType = 'inbody';
        const found = Object.entries(parsed).filter(([k,v])=>v!=null && k!=='date').map(([k])=>k);
        summary = `تحليل InBody — تاريخ ${parsed.date} · استخرج ${found.length} قيمة`;
      } else if(type==='lab'){
        parsed = parseLabReport(text);
        dataType = 'lab';
        const found = Object.entries(parsed).filter(([k,v])=>v!=null && !['date','hosp','raw'].includes(k)).map(([k])=>k);
        summary = `تحليل مخبري — ${parsed.hosp} · ${parsed.date} · ${found.length} قيمة`;
      } else {
        importEntry.status = 'failed';
        importEntry.error = 'لم نتمكن من تحديد نوع التقرير تلقائياً. جرّب اختيار النوع يدوياً قبل الرفع.';
        statusDiv.innerHTML = `<div class="alert alert-warn"><span>⚠</span><span>${importEntry.error}</span></div>`;
        finalizeImport(importEntry);
        return;
      }
      pendingImport = {file, type:dataType, data:parsed, raw:text.slice(0,500), importEntry};
      showPreview();
      statusDiv.innerHTML = '';
    }
    else if(['xlsx','xls','csv'].includes(ext)){
      // User chose Excel? Or auto?
      if(userType === 'lab' || userType === 'inbody'){
        importEntry.status = 'failed';
        importEntry.error = `اخترت نوع "${userType==='lab'?'تحاليل مخبرية':'InBody'}" لكن الملف ليس PDF. ملفات Excel تدخل تحت "جدول بيانات".`;
        statusDiv.innerHTML = `<div class="alert alert-warn"><span>⚠</span><span>${importEntry.error}</span></div>`;
        finalizeImport(importEntry);
        return;
      }
      const sheets = await parseExcelFile(file);
      const categorized = categorizeExcelRows(sheets);
      const counts = Object.entries(categorized).map(([k,v])=>v.length?`${v.length} ${{sugar:'سكر',bp:'ضغط',weight:'وزن',meals:'وجبة',labs:'تحليل'}[k]}`:'').filter(Boolean);
      if(!counts.length){
        importEntry.status='failed';
        importEntry.error='لم نتمكن من العثور على بيانات قابلة للاستيراد. تأكد من وجود أعمدة معروفة (date, sugar, sys, dia, weight, calories...)';
        statusDiv.innerHTML = `<div class="alert alert-warn"><span>⚠</span><span>${importEntry.error}</span></div>`;
        finalizeImport(importEntry);
        return;
      }
      pendingImport = {file, type:'excel', data:categorized, importEntry};
      pendingImport.summary = counts.join(' · ');
      showPreview();
      statusDiv.innerHTML = '';
    }
    else {
      importEntry.status='failed';
      importEntry.error = 'نوع الملف غير مدعوم. المدعوم: PDF, Excel, CSV';
      statusDiv.innerHTML = `<div class="alert alert-warn"><span>⚠</span><span>${importEntry.error}</span></div>`;
      finalizeImport(importEntry);
    }
  } catch(err){
    console.error(err);
    importEntry.status='failed';
    importEntry.error = err.message || 'حدث خطأ غير متوقع';
    statusDiv.innerHTML = `<div class="alert alert-warn"><span>⚠</span><span>فشل قراءة الملف: ${err.message}</span></div>`;
    finalizeImport(importEntry);
  }
}

function finalizeImport(entry){
  importLog.unshift(entry);
  importLog = importLog.slice(0, 100);
  SAVE('import_log', importLog);
  setTimeout(()=>{ if(curTab==='import') RENDERERS.import(); }, 500);
}

function confirmLabImport(){
  const e = pendingImport.importEntry;
  const get = id => document.getElementById(id).value;
  const entry = {
    id: Date.now(),
    date: get('prev-date')||todayStr(),
    hosp: get('prev-hosp')||'—',
    hba1c: +get('prev-hba1c')||null,
    fbs:   +get('prev-fbs')||null,
    chol:  +get('prev-chol')||null,
    ldl:   +get('prev-ldl')||null,
    hdl:   +get('prev-hdl')||null,
    tg:    +get('prev-tg')||null,
    cr:    +get('prev-cr')||null,
    alt:   +get('prev-alt')||null,
    note:  'استيراد من ' + e.fileName,
  };
  savedLabs.unshift(entry);
  SAVE('saved_labs', savedLabs);
  e.status='success';
  e.summary = `تحليل ${entry.hosp} · ${entry.date} · حُفظ في التحاليل`;
  finalizeImport(e);
  pendingImport=null;
  toast('✅ تم حفظ التحليل');
  document.getElementById('importPreview').innerHTML='';
  RENDERERS.import();
}

function confirmInBodyImport(){
  const e = pendingImport.importEntry;
  const get = id => document.getElementById(id).value;
  const entry = {
    id: Date.now(),
    date: get('prev-date')||todayStr(),
    weight:      +get('prev-w')||null,
    fatPct:      +get('prev-fat')||null,
    muscleMass:  +get('prev-mus')||null,
    visceralFat: +get('prev-vis')||null,
    water:       +get('prev-water')||null,
    bmi:         +get('prev-bmi')||null,
    bmr:         +get('prev-bmr')||null,
    note: 'استيراد من ' + e.fileName,
  };
  inbodyLog.unshift(entry);
  SAVE('inbody_log', inbodyLog);
  window.inbodyLog = inbodyLog;
  e.status='success';
  e.summary = `InBody · ${entry.date} · حُفظ`;
  finalizeImport(e);
  pendingImport=null;
  toast('✅ تم حفظ InBody');
  document.getElementById('importPreview').innerHTML='';
  RENDERERS.import();
}

function confirmExcelImport(){
  const e = pendingImport.importEntry;
  const c = pendingImport.data;
  const counts = {sugar:0,bp:0,weight:0,meals:0,labs:0};

  c.sugar.forEach(r=>{
    if(r.value){
      sugarLog.unshift({id:Date.now()+Math.random(),...r});
      counts.sugar++;
    }
  });
  c.bp.forEach(r=>{
    if(r.sys && r.dia){
      bpLog.unshift({id:Date.now()+Math.random(),...r});
      counts.bp++;
    }
  });
  c.weight.forEach(r=>{
    if(r.weight){
      weightLog.unshift({id:Date.now()+Math.random(),...r});
      counts.weight++;
    }
  });
  c.meals.forEach(r=>{
    mealLog.unshift({id:Date.now()+Math.random(),...r});
    counts.meals++;
  });
  c.labs.forEach(r=>{
    if(r.hba1c||r.fbs||r.chol){
      savedLabs.unshift({id:Date.now()+Math.random(),...r,note:'استيراد من '+e.fileName});
      counts.labs++;
    }
  });

  SAVE('sugar_log',sugarLog); window.sugarLog=sugarLog;
  SAVE('bp_log',bpLog); window.bpLog=bpLog;
  SAVE('weight_log',weightLog); window.weightLog=weightLog;
  SAVE('meal_log',mealLog); window.mealLog=mealLog;
  SAVE('saved_labs',savedLabs);

  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  e.status = total>0 ? 'success' : 'partial';
  e.summary = Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`${v} ${({sugar:'سكر',bp:'ضغط',weight:'وزن',meals:'وجبة',labs:'تحليل'})[k]}`).join(' · ');
  finalizeImport(e);
  pendingImport=null;
  toast(`✅ تم استيراد ${total} سجل`);
  document.getElementById('importPreview').innerHTML='';
  RENDERERS.import();
}

function cancelImport(){
  if(pendingImport){
    pendingImport.importEntry.status='cancelled';
    pendingImport.importEntry.summary='ألغى المستخدم الاستيراد';
    finalizeImport(pendingImport.importEntry);
    pendingImport=null;
  }
  document.getElementById('importPreview').innerHTML='';
  toast('تم الإلغاء');
}

function clearImportLog(){
  if(!confirm('مسح كامل سجل الاستيراد؟ (لن تتأثر البيانات المحفوظة)'))return;
  importLog=[];
  SAVE('import_log',importLog);
  RENDERERS.import();
  toast('🗑 تم المسح');
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Show install button if backup page is open
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'block';
});

function triggerInstall(){
  if(!deferredInstallPrompt){
    toast('💡 على iPhone: اضغط زر المشاركة في Safari ← "إضافة إلى الشاشة الرئيسية"');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(choice => {
    if(choice.outcome === 'accepted') toast('✅ تم التثبيت');
    deferredInstallPrompt = null;
    const btn = document.getElementById('installBtn');
    if(btn) btn.style.display = 'none';
  });
}

(async function checkRecovery(){
  // Only attempt recovery if localStorage seems empty but IDB might have data

    .some(k=>{
      const v = localStorage.getItem(k);
      return v && v !== '[]' && v !== 'null';
    });
  if(!hasAnyData){
    const restored = await recoverFromIdb();
    if(restored > 0){
      toast(`💾 استعادة ${restored} عنصر من النسخة الدائمة`);
      setTimeout(()=>{
        // Reload data from localStorage
        sugarLog = LS('sugar_log',[]);
        bpLog = LS('bp_log',[]);
        weightLog = LS('weight_log',[]);
        meds = LS('meds',[]);
        medLog = LS('med_log',[]);
        mealLog = LS('meal_log',[]);
        activityLog = LS('activity_log',[]);
        sleepLog = LS('sleep_log',[]);
        waterLog = LS('water_log',[]);
        inbodyLog = LS('inbody_log',[]);
        symptomsLog = LS('symptoms_log',[]);
        notesLog = LS('notes_log',[]);
        importLog = LS('import_log',[]);
        savedLabs = LS('saved_labs',[]);
        const p = LS('profile', null);
        if(p) profile = p;
        // expose globals
        window.sugarLog=sugarLog; window.bpLog=bpLog; window.weightLog=weightLog;
        window.mealLog=mealLog; window.activityLog=activityLog; window.sleepLog=sleepLog;
        window.symptomsLog=symptomsLog; window.inbodyLog=inbodyLog;
        if(curTab && RENDERERS[curTab]) RENDERERS[curTab]();
      }, 800);
    }
  }
})();

//  IN-APP NOTIFICATION SYSTEM
//  Shows toast + sound alerts on app startup for urgent items
// ════════════════════════════════════════════════════
function playNotificationBeep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.start(ctx.currentTime);
    o.stop(ctx.currentTime + 0.4);
  } catch(e){}
}

function showStartupNotifications(){
  // Check for urgent items: today's appointments, missed meds, critical readings
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const urgentItems = [];

  // Today's appointments
  appointments.forEach(a => {
    const ad = parseDate(a.date);
    if(ad.getTime() === today0.getTime()){
      urgentItems.push({
        icon:'🔔',
        title:`موعد اليوم: ${a.title}`,
        details: a.time ? `الساعة ${a.time}${a.location?' · '+a.location:''}` : (a.location||''),
        color:'#dc2626'
      });
    } else if(ad.getTime() === today0.getTime() + 86400000){
      urgentItems.push({
        icon:'⏰',
        title:`موعد غداً: ${a.title}`,
        details: a.time ? `الساعة ${a.time}` : '',
        color:'#fbbf24'
      });
    }
  });

  // Critical sugar from yesterday
  const ysug = sugarLog.find(x => x.value < 70 && within(x.date, 1));
  if(ysug){
    urgentItems.push({
      icon:'🚨',
      title:'هبوط سكر مسجل',
      details:`${ysug.value} mg/dl - ${ysug.date}`,
      color:'#dc2626'
    });
  }

  if(urgentItems.length === 0) return;

  // Show notification banner at top
  const banner = document.createElement('div');
  banner.id = 'startupNotif';
  banner.style.cssText = `
    position:fixed; top:0; left:0; right:0; z-index:9999;
    background:linear-gradient(135deg,#0a1628,#1e293b);
    border-bottom:2px solid #dc2626;
    padding:14px 16px;
    box-shadow:0 4px 16px rgba(220,38,38,0.3);
    animation:slideDown 0.4s ease-out;
  `;
  banner.innerHTML = `
    <style>@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}</style>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:600px;margin:0 auto">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <div style="font-size:28px">🔔</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:800;color:#fbbf24">${urgentItems.length} تنبيه ${urgentItems.length===1?'جديد':'جديدة'}</div>
          <div style="font-size:11px;color:#cbd5e1">${urgentItems[0].title}</div>
        </div>
      </div>
      <button onclick="closeStartupNotif()" style="background:#dc2626;color:#fff;border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer">عرض</button>
      <button onclick="document.getElementById('startupNotif').remove()" style="background:transparent;border:1px solid #475569;color:#94a3b8;border-radius:8px;padding:7px 10px;font-size:11px;cursor:pointer">إغلاق</button>
    </div>
  `;
  document.body.appendChild(banner);
  playNotificationBeep();

  // Auto-hide after 8 seconds
  setTimeout(()=>{
    const el = document.getElementById('startupNotif');
    if(el){ el.style.transition='all 0.4s'; el.style.transform='translateY(-100%)'; el.style.opacity='0';
            setTimeout(()=>el.remove(), 400); }
  }, 8000);
}

function closeStartupNotif(){
  document.getElementById('startupNotif')?.remove();
  goTab('insights');
}

// Run notifications after a small delay
setTimeout(showStartupNotifications, 800);

// ── Backup reminder: if has data and no backup in 7 days, gentle nudge ──
setTimeout(()=>{
  const lastBackup = +(localStorage.getItem('_last_backup_time')||0);
  const daysAgo = (Date.now() - lastBackup) / 86400000;
  const hasData = sugarLog.length > 5 || bpLog.length > 3 || mealLog.length > 5;
  if(hasData && daysAgo > 7){
    setTimeout(()=>{
      if(confirm('💾 لم تأخذ نسخة احتياطية منذ أكثر من أسبوع.\n\nهل تريد تحميل نسخة الآن؟ (لحماية بياناتك)')){
        downloadBackup();
      }
    }, 4000);

}, 1500);

// Haptic feedback via Vibration API (works on some iOS)
function haptic(type){
  try{
    if(navigator.vibrate){
      if(type==='light')   navigator.vibrate(10);
      else if(type==='medium') navigator.vibrate(20);
      else if(type==='heavy')  navigator.vibrate([30,10,30]);
      else if(type==='success') navigator.vibrate([10,50,10]);
      else if(type==='error')   navigator.vibrate([50,10,50,10,50]);
    }
  }catch(e){}
}

// Swipe-to-navigate between tabs
(function setupSwipe(){
  const tabOrder = ['dash','sugar','meds','vitals','meals','life','inbody','symptoms','screenings','insights','calendar','labs','charts','report','import','backup'];
  let startX=0, startY=0, startTime=0;
  
  document.getElementById('content').addEventListener('touchstart', e=>{
    startX = e.changedTouches[0].pageX;
    startY = e.changedTouches[0].pageY;
    startTime = Date.now();
  }, {passive:true});
  
  document.getElementById('content').addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].pageX - startX;
    const dy = e.changedTouches[0].pageY - startY;
    const dt = Date.now() - startTime;
    const scrollTop = document.getElementById('content').scrollTop;
    
    // Only trigger if horizontal swipe, fast, significant distance, near top of scroll
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*2 && dt < 350 && scrollTop < 50){
      const curIdx = tabOrder.indexOf(curTab);
      if(dx < 0 && curIdx < tabOrder.length-1){
        // Swipe left = next tab
        goTab(tabOrder[curIdx+1]);
        haptic('light');
      } else if(dx > 0 && curIdx > 0){
        // Swipe right = previous tab
        goTab(tabOrder[curIdx-1]);
        haptic('light');
      }
    }
  }, {passive:true});
})();

// Prevent pull-to-refresh on iOS
(function preventPullRefresh(){
  let lastTouchY = 0;
  document.addEventListener('touchstart', e=>{
    lastTouchY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    const scrollTop = document.scrollingElement?.scrollTop || 0;
    const touchY = e.touches[0].clientY;
    if(scrollTop === 0 && touchY > lastTouchY){
      // At top and pulling down — prevent
      if(e.cancelable) e.preventDefault();
    }
    lastTouchY = touchY;
  }, {passive:false});
})();

// iOS keyboard handling — scroll focused input into view
document.addEventListener('focusin', e=>{
  if(e.target.matches('input,textarea,select')){
    setTimeout(()=>{
      e.target.scrollIntoView({behavior:'smooth', block:'center'});
    }, 300);
  }
});

// Dismiss keyboard on background tap in modals
document.addEventListener('touchend', e=>{
  if(e.target.classList.contains('modal-bg')){
    document.activeElement?.blur();
  }
}, {passive:true});

// Add haptic to key interactions
const origGoTab = goTab;
window.goTab = function(id){
  haptic('light');
  origGoTab(id);
};

const origToggleQuickMenu = toggleQuickMenu;
window.toggleQuickMenu = function(){
  haptic('medium');
  origToggleQuickMenu();
};

// iOS status bar height detection
function getStatusBarHeight(){
  const match = getComputedStyle(document.documentElement).getPropertyValue('--sat');
  return parseInt(match) || 44;
}

// Long press on cards to reveal actions (iOS pattern)
let longPressTimer = null;
document.addEventListener('touchstart', e=>{
  const card = e.target.closest('.log-item');
  if(!card) return;
  longPressTimer = setTimeout(()=>{
    haptic('heavy');
    card.style.background = 'rgba(42,63,95,0.8)';

  }, 500);
}, {passive:true});
document.addEventListener('touchend', ()=>{
  clearTimeout(longPressTimer);
}, {passive:true});

// Announce page transitions for screen readers
function announceTab(id){
  const names = {
    dash:'الرئيسية',sugar:'السكر',meds:'الأدوية',vitals:'الضغط والوزن',
    meals:'الغذاء',life:'النشاط والنوم',inbody:'InBody',symptoms:'الأعراض',
    screenings:'فحوصات السكري',insights:'المساعد الذكي',calendar:'المواعيد',
    labs:'التحاليل',charts:'التحليلات',report:'تقرير الطبيب',
    import:'استيراد ملفات',backup:'النسخ الاحتياطي',
  };
  const liveRegion = document.getElementById('a11y-live');
  if(liveRegion) liveRegion.textContent = 'تبويب: ' + (names[id]||id);
}

// Override toast for iOS-style centered position
const origToast = toast;
window.toast = function(msg){
  haptic('light');
  origToast(msg);
};

// iOS-style bottom sheet drag-to-close
(function setupModalDrag(){
  let startY=0, isDragging=false;
  document.addEventListener('touchstart', e=>{
    const handle = e.target.closest('.modal-handle');
    if(handle){
      startY = e.touches[0].clientY;
      isDragging = true;
    }
  }, {passive:true});
  document.addEventListener('touchmove', e=>{
    if(!isDragging) return;
    const dy = e.touches[0].clientY - startY;
    const modal = document.querySelector('.modal');
    if(modal && dy > 0){
      modal.style.transform = `translateY(${dy}px)`;
      modal.style.transition = 'none';
    }
  }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(!isDragging) return;
    isDragging = false;
    const dy = e.changedTouches[0].clientY - startY;
    const modal = document.querySelector('.modal');
    if(modal){
      modal.style.transform = '';
      modal.style.transition = '';
      if(dy > 100){ closeModal(); haptic('light'); }
    }
  }, {passive:true});
})();

// Scroll active tab into view when switching
const origGoTabInner = window.goTab;
window.goTab = function(id){
  origGoTabInner(id);
  // Scroll tab button into view
  setTimeout(()=>{
    const activeBtn = document.querySelector(`.tab-btn[data-tab="${id}"]`);
    if(activeBtn){
      activeBtn.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    }
    announceTab(id);
  }, 50);
};
